function noSeason() {
  return `<div class="empty"><h2>No season yet</h2><p class="muted">${isCommish() ? "Set up the season, teams and schedule." : "The commissioner hasn't set up the season yet."}</p>${isCommish() ? `<a class="btn strike" href="#admin">Set up the season</a>` : ""}</div>`;
}

/* ---- Board ---- */
function viewBoard(r, s) {
  if (!s) return `<h1>Board</h1>${noSeason()}`;
  const wk = effectiveWeek(s);
  const ms = matchesOf(s, wk);
  const live = ms.filter((m) => m.status === "live");
  const lad = ladderOf(s, wk);
  const st = standings(s).slice(0, 4);
  const L = leaders(s);
  const n = nightOf(s, wk);
  const running = [1, 2, 3, 4].map((sl) => [sl, slotClock(n, sl)]).find(([, c]) => c && c.running);
  let html = `<div class="section-title"><h1>Week ${wk}</h1><span class="sub">${h(fmtDate(weekDate(s, wk)))}${running ? `, slot ${running[0]} <span class="num">${running[1].text}</span>` : ""}</span></div>`;
  if (beforeLaunch()) {
    const c = countdown(LAUNCH_AT);
    const when = new Date(LAUNCH_AT);
    html += `<div class="launch-hero"><div class="lh-top">Season one</div><div class="lh-when">${h(when.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" }))}, ${h(when.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }))}</div>
      <div class="lh-count" id="launch-hero"><div><b>${c.d}</b><small>days</small></div><div><b>${String(c.h).padStart(2, "0")}</b><small>hours</small></div><div><b>${String(c.m).padStart(2, "0")}</b><small>min</small></div><div><b>${String(c.s).padStart(2, "0")}</b><small>sec</small></div></div></div>`;
  }
  if (store.mode === "demo") html += CONFIG.SHOWCASE ? `<div class="banner quiet"><b>Preview.</b> A sample league to look around in. Switch between Administrator, Support and Player under <a href="#account">Account → Try the app as</a>. Buttons work to tap, but nothing you do changes the league.</div>` : `<div class="banner quiet"><b>Demo mode.</b> Sample league, data stays on this device. Go to <a href="#account">Account</a> to see how to take it live.</div>`;
  const mine = me() ? S.players.find((p) => p.profileId === me().id) : null;
  if (mine && ms.length) {
    const t = team(mine.teamId);
    const plays = ms.filter((m) => m.homeId === t.id || m.awayId === t.id).map((m) => `slot ${m.slot} pit ${m.pit} v ${codeOf(m.homeId === t.id ? m.awayId : m.homeId)}`);
    const here = n?.present?.includes(mine.id);
    const later = matchesOf(s).filter((m) => m.week > wk && (m.homeId === t.id || m.awayId === t.id)).slice(0, 2);
    html += `<div class="banner"><b>Your night, ${h(t.name)}:</b> play ${h(plays.join(" and "))}.${here ? " You're checked in." : n?.present?.length ? " Not checked in yet, see the league table." : ""}${later.length ? ` <span class="muted">Week ${later[0].week}: v ${later.map((m) => codeOf(m.homeId === t.id ? m.awayId : m.homeId)).join(" and ")}.</span>` : ""} <a href="#league">Season grid</a></div>`;
  }
  if (!ms.length) {
    html += `<div class="empty"><p>No Gauntlets scheduled for week ${wk}.</p>${isCommish() ? `<a class="btn" href="#admin">Build the schedule</a>` : ""}</div>`;
  } else {
    if (live.length) html += `<div class="section-title"><h2>Live now</h2></div>${live.map((m) => bigBoard(m)).join("")}`;
    const next = ms.filter((m) => m.status === "scheduled").slice(0, 2);
    const done = ms.filter((m) => m.status === "final" || m.status === "forfeit");
    if (next.length) html += `<div class="section-title"><h2>Up next</h2><span class="sub">Slot ${next[0].slot}</span></div><div class="grid2">${next.map((m) => scoreboard(m)).join("")}</div>`;
    if (done.length) html += `<div class="section-title"><h2>Tonight's results</h2><span class="sub">${done.length} of ${ms.length}</span></div><div class="grid2">${done.map((m) => scoreboard(m)).join("")}</div>`;
    const tk = ladderTickets(s, wk);
    html += `<div class="section-title"><h2>The Ladder</h2><span class="sub">${lad?.winnerId ? "Final" : tk.total ? tk.total + (tk.total === 1 ? " ticket" : " tickets") + " so far" : "Closes the night"}</span></div>
      <a class="block" style="display:block;text-decoration:none" href="#score/l/${wk}">
        ${lad?.winnerId ? `<div class="row between"><div><div class="muted">Took the Ladder</div><div style="font-family:var(--display);font-weight:800;font-size:26px">${pName(lad.winnerId)}</div><div class="muted">${nameOf(lad.winnerTeamId)}, ${money(lad.prize || ladderPrize(s, wk))} to the spoils</div></div><span class="pill final">Final</span></div>`
        : `<div class="muted">The redemption bracket: one ticket per loss tonight, Gauntlets and King of the Pit. ${money(ladderPrize(s, wk))} to the winner's team.</div>`}
      </a>`;
  }
  html += `<div class="grid2">
    <div><div class="section-title"><h2>Standings</h2><a class="sub" href="#league">Full table</a></div>
      <table class="tbl"><thead><tr><th></th><th style="text-align:left">Team</th><th>W</th><th>L</th><th>Pts</th></tr></thead><tbody>
      ${st.map((row) => `<tr><td class="rank">${rankLabel(row)}</td><td class="team">${swatch(row.team.id)}<span class="code">${h(row.team.code)}</span>${h(row.team.name)}</td><td>${row.w}</td><td>${row.l}</td><td class="pts">${row.pts}</td></tr>`).join("")}
      </tbody></table></div>
    <div><div class="section-title"><h2>Most outs</h2><a class="sub" href="#league">All leaders</a></div>
      <div class="leader"><ol>${L.outs.slice(0, 4).map((x) => `<li><span class="who">${pLabel(x.id)}</span><span class="n">${x.v}</span></li>`).join("") || `<li class="muted">No outs logged yet.</li>`}</ol></div></div>
  </div>`;
  return html;
}

/* ---- Score ---- */
function viewScore(r, s) {
  if (!s) return `<h1>Score</h1>${noSeason()}`;
  if (r.a === "m" && r.b) return viewMatch(r, s);
  if (r.a === "l" && r.b) return viewLadder(r, s);
  if (r.a === "n" && r.b) return viewNight(r, s);
  if (r.a === "ops" && r.b) return viewOps(r, s);
  const wk = UI.scoreWeek || effectiveWeek(s);
  const ms = matchesOf(s, wk);
  const lad = ladderOf(s, wk);
  const n = nightOf(s, wk);
  let html = `<div class="section-title"><h1>Score</h1><span class="sub">${canScore() ? (refOn() && !isStaff() ? "Ref mode: this phone scores." : "Scoring unlocked.") : `Tap <b>Ref</b> and enter the night's PIN to score.`}</span></div>`;
  if (!canScore()) html += `<div class="btnrow" style="margin-bottom:10px"><button class="btn strike" data-action="ref-unlock">Ref</button></div>`;
  html += weekTabs(s, wk, "score-week");
  if (!ms.length) return html + `<div class="empty">No Gauntlets for week ${wk}.</div>`;
  const presentN = (n?.present || []).length;
  const owing = teamsOf(s).filter((t) => !(n?.paid || []).includes(t.id)).length;
  const running = [1, 2, 3, 4].map((sl) => [sl, slotClock(n, sl)]).find(([, c]) => c && c.running);
  html += `<a class="block" style="display:block;text-decoration:none" href="#score/ops/${wk}"><div class="row between"><h3>Night ops</h3>${running ? `<span class="pill live">Slot ${running[0]}, ${running[1].text}</span>` : `<span class="pill">${presentN ? presentN + " checked in" : "Check-in"}</span>`}</div><div class="muted" style="margin-top:6px">${presentN ? `${presentN} of ${S.players.filter((p) => teamsOf(s).some((t) => t.id === p.teamId)).length} checked in` : "Check-in, fees"}${owing ? `, ${owing} team${owing === 1 ? "" : "s"} owe the fee` : ", fees in"}, slot clock</div></a>`;
  for (let slot = 1; slot <= 4; slot++) {
    const sm = ms.filter((m) => m.slot === slot);
    if (!sm.length) continue;
    html += `<div class="slot-h"><h3>Slot ${slot}</h3><span class="off">${slotNote(slot)}</span></div><div class="grid2">${sm.map((m) => scoreboard(m)).join("")}</div>`;
    if (slot === 2) html += `<div class="breakline">Ref break, 5–10 minutes</div>`;
  }
  const tk = ladderTickets(s, wk);
  const nCatch = sum(Object.values(n?.catches || {}));
  html += `<div class="slot-h"><h3>Closing the night</h3></div><div class="grid2">
    <a class="block" style="display:block;text-decoration:none;margin:0" href="#score/l/${wk}"><div class="row between"><h3>The Ladder</h3>${lad?.winnerId ? `<span class="pill final">Final</span>` : `<span class="pill">${tk.total} ${tk.total === 1 ? "ticket" : "tickets"}</span>`}</div><div class="muted" style="margin-top:6px">${lad?.winnerId ? pName(lad.winnerId) + " took it" : "Redemption bracket, after slot 4"}</div></a>
    <a class="block" style="display:block;text-decoration:none;margin:0" href="#score/n/${wk}"><div class="row between"><h3>Catches</h3><span class="pill">${nCatch || "None"}</span></div><div class="muted" style="margin-top:6px">From No Man's Land</div></a>
  </div>`;
  return html;
}
function slotNote(slot) { return slot === 1 ? "First pitch" : slot === 2 ? "Then the ref break" : slot === 4 ? "Then the Ladder" : ""; }
function weekTabs(s, wk, action) {
  const cur = effectiveWeek(s);
  return `<div class="weektabs" role="tablist">${Array.from({ length: s.weeks }, (_, i) => i + 1).map((w) => `<button role="tab" aria-selected="${w === wk}" class="${w === wk ? "on" : ""} ${w === cur ? "tonight" : ""}" data-action="${action}" data-week="${w}">${w}</button>`).join("")}</div>`;
}
function viewMatch(r, s) {
  const m = S.matches.find((x) => x.id === r.b);
  if (!m) return `<div class="empty">Gauntlet not found. <a href="#score">Back to scoring</a></div>`;
  const v = matchView(m);
  const H = team(m.homeId), A = team(m.awayId);
  const roster = (teamId) => playersOf(teamId);
  let html = `<div class="row between" style="margin-bottom:10px"><a class="btn sm ghost" href="#score">‹ Week ${m.week}</a><span class="muted">Slot ${m.slot}, Pit ${h(m.pit)}</span>${!canScore() ? `<button class="btn sm strike" data-action="ref-unlock">Ref</button>` : ""}</div>`;
  html += `<div class="board ${m.status === "live" ? "live" : ""}">
    <div class="side"><div class="code">${h(H.code)}</div><div class="tname">${h(H.name)}</div></div>
    <div class="rounds"><span>${m.homeRounds}</span><span class="dash">–</span><span>${m.awayRounds}</span></div>
    <div class="side r"><div class="code">${h(A.code)}</div><div class="tname">${h(A.name)}</div></div>
    <div class="state">${m.status === "live" ? `Round <b>${v.round}</b>, first to ${v.need}` : m.status === "final" ? `Final, <b>${codeOf(m.winnerId)}</b> wins` : m.status === "forfeit" ? `Forfeit by <b>${codeOf(m.forfeitBy)}</b>, ${codeOf(m.winnerId)} takes it` : `Scheduled, best of ${s.bestOf}`}</div>
  </div>`;
  if (!canScore()) {
    if (m.status === "live") html += pitColumns(m, v, false);
    if (m.status === "final" || m.status === "forfeit") html += kohBlock(m, s);
    html += outsLog(m);
    return html;
  }
  if (m.status === "scheduled") {
    html += `<div class="section-title"><h2>Lineups</h2><span class="sub">Tap to toggle who's in the pit. Five in, one sub.</span></div>`;
    html += lineupEditor(m, "home") + lineupEditor(m, "away");
    html += `<div class="btnrow" style="margin-top:14px"><button class="btn strike big" data-action="start-match" data-id="${h(m.id)}">Start the Gauntlet</button></div>
      <div class="btnrow" style="margin-top:10px"><button class="btn ghost sm" data-action="forfeit-pick" data-id="${h(m.id)}">Record a forfeit</button></div>`;
    return html;
  }
  if (m.status === "live") {
    const roundFresh = v.thisRound.length === 0;
    if (roundFresh) html += `<div class="callout">Walls. <span>This is Gauntlet.</span></div>`;
    html += pitColumns(m, v, true);
    html += `<div class="btnrow" style="margin-top:14px">
      <button class="btn" data-action="undo-out" data-id="${h(m.id)}" ${v.last ? "" : "disabled"}>Undo last out</button>
      ${roundFresh ? `<button class="btn ghost" data-action="edit-lineups" data-id="${h(m.id)}">Edit lineups</button>` : ""}
      <button class="btn ghost" data-action="forfeit-pick" data-id="${h(m.id)}">Forfeit</button>
      <button class="btn ghost" data-action="incident-new" data-week="${m.week}" data-match="${h(m.id)}">Injury</button>
    </div>`;
    if (UI.editLineups === m.id && roundFresh) html += `<div style="margin-top:14px">` + lineupEditor(m, "home") + lineupEditor(m, "away") + `</div>`;
    html += outsLog(m);
    return html;
  }
  // final / forfeit
  if (m.status === "final") {
    const loser = m.winnerId === m.homeId ? m.awayId : m.homeId;
    html += `<div class="block"><dl class="kv"><dt>Winner</dt><dd>${nameOf(m.winnerId)}, ${s.pointsWin} points, ${money(sp(s).gauntlet)} to the spoils</dd><dt>Last man standing</dt><dd>${m.loserLastMan ? pName(m.loserLastMan) + " (" + codeOf(loser) + "), holds a Ladder ticket" : "—"}</dd></dl></div>`;
  }
  if (m.status === "forfeit") html += `<div class="block"><dl class="kv"><dt>Forfeit</dt><dd>${money(sp(s).forfeit)} to ${nameOf(m.winnerId)}'s spoils, ${money(sp(s).ladderForfeit)} onto tonight's Ladder prize</dd></dl></div>`;
  html += kohBlock(m, s);
  html += outsLog(m);
  html += `<div class="btnrow" style="margin-top:14px"><button class="btn ghost sm" data-action="incident-new" data-week="${m.week}" data-match="${h(m.id)}">Log an injury</button>${isCommish() ? `<button class="btn ghost sm" data-action="reopen-match" data-id="${h(m.id)}">Reset this Gauntlet</button>` : ""}</div>`;
  return html;
}
function lineupEditor(m, side) {
  const teamId = side === "home" ? m.homeId : m.awayId;
  const lineup = side === "home" ? m.homeLineup || [] : m.awayLineup || [];
  const ros = playersOf(teamId);
  const sel = new Set(lineup.length ? lineup : defaultLineup(teamId, season(), m.week));
  const present = presentTonight(season(), m.week);
  return `<div class="pit-col" style="margin-bottom:12px"><h3>${swatch(teamId)}${nameOf(teamId)} <small>${sel.size} in${sel.size < 4 ? ", short-handed (minimum 4)" : ""}</small></h3><div class="chips">
    ${ros.map((p) => `<button class="chip ${sel.has(p.id) ? "sel" : "pick"}" data-action="toggle-lineup" data-id="${h(m.id)}" data-side="${side}" data-player="${h(p.id)}" aria-pressed="${sel.has(p.id)}"><span class="jn">${p.jersey ?? ""}</span><span class="pn">${h(p.name)}</span>${p.captain ? `<span class="cap">C</span>` : ""}<span class="how">${sel.has(p.id) ? "In" : present && !present.has(p.id) ? "Not here" : "Sub"}</span></button>`).join("")}
    ${ros.length === 0 ? `<div class="muted">No players on this roster yet.</div>` : ""}
  </div></div>`;
}
function pitColumns(m, v, interactive) {
  const col = (teamId, lineup, inPit) => {
    const outsHere = v.thisRound.filter((o) => o.teamId === teamId);
    return `<div class="pit-col"><h3>${swatch(teamId)}${codeOf(teamId)} <small>${inPit.length} in</small></h3><div class="chips">
      ${lineup.map((pid) => {
        const p = player(pid); if (!p) return "";
        const o = outsHere.find((x) => x.playerId === pid);
        if (o) return `<div class="chip out"><span class="jn">${p.jersey ?? ""}</span><span class="pn">${h(p.name)}</span><span class="how">${o.byPlayerId ? "by " + h(player(o.byPlayerId)?.name || "") : "no striker"}</span></div>`;
        return interactive
          ? `<button class="chip pick" data-action="out-pick" data-id="${h(m.id)}" data-player="${h(pid)}"><span class="jn">${p.jersey ?? ""}</span><span class="pn">${h(p.name)}</span>${p.captain ? `<span class="cap">C</span>` : ""}<span class="how hint">Tap when out</span></button>`
          : `<div class="chip"><span class="jn">${p.jersey ?? ""}</span><span class="pn">${h(p.name)}</span>${p.captain ? `<span class="cap">C</span>` : ""}</div>`;
      }).join("")}
    </div></div>`;
  };
  return `<div class="pit-cols">${col(m.homeId, m.homeLineup || [], v.homeIn)}${col(m.awayId, m.awayLineup || [], v.awayIn)}</div>`;
}
function outsLog(m) {
  const outs = outsOf(m.id);
  if (!outs.length) return "";
  return `<div class="section-title"><h2>Outs</h2><span class="sub">${outs.length} logged</span></div><ul class="log">${[...outs].reverse().map((o) => `<li><span class="r">R${o.round}</span><span>${pLink(o.playerId)} (${codeOf(o.teamId)}) out${o.byPlayerId ? " by " + pLink(o.byPlayerId) + (player(o.byPlayerId)?.teamId === o.teamId ? " (friendly fire)" : "") : ", no striker"}${o.closedRound ? " — round over" : ""}</span></li>`).join("")}</ul>`;
}
function openOutSheet(m, victimId) {
  const v = matchView(m);
  const vTeam = playerTeam(m, victimId);
  const opp = (vTeam === m.homeId ? v.awayIn : v.homeIn);
  const own = (vTeam === m.homeId ? v.homeIn : v.awayIn).filter((id) => id !== victimId);
  const chip = (pid, group) => `<button class="chip pick" data-action="out-save" data-player="${h(pid)}"><span class="jn">${player(pid)?.jersey ?? ""}</span><span class="pn">${pName(pid)}</span><span class="how">${group}</span></button>`;
  UI.sheet = { kind: "out", matchId: m.id, victimId, html: `
    <h2>${pName(victimId)} is out</h2>
    <p class="muted">Tap who hit it and the out is logged.</p>
    <div class="chips sheet-grid">
      ${opp.map((id) => chip(id, codeOf(playerTeam(m, id)))).join("")}
      ${own.length ? own.map((id) => chip(id, "FF")).join("") : ""}
      <button class="chip pick wide" data-action="out-save" data-player=""><span class="jn">—</span><span class="pn">No striker</span><span class="how">Double touch, foot, wall</span></button>
    </div>
    <div class="btnrow" style="margin-top:12px"><button class="btn ghost" data-action="sheet-close">Cancel</button></div>` };
}
/* ---- King of the Pit: right after the Gauntlet, the two benched players, best of 3 in the 10 ft pit ---- */
function kohBlock(m, s) {
  const k = kohOf(m);
  const P = sp(s);

/* ---- League card: a digital ID card, printable at 3.375 × 2.125 in ---- */
function barcode(n) {
  // Code 39 of the GBPI digits, dark bars on a light strip, so any barcode app reads the number back.
  // Each character is five bars and four spaces (n = narrow, w = wide), framed by the * start/stop character.
  const T = { 0: "nnnwwnwnn", 1: "wnnwnnnnw", 2: "nnwwnnnnw", 3: "wnwwnnnnn", 4: "nnnwwnnnw", 5: "wnnwwnnnn", 6: "nnwwwnnnn", 7: "nnnwnnwnw", 8: "wnnwnnwnn", 9: "nnwwnnwnn", "*": "nwnnwnwnn" };
  const chars = ["*", ...String(n).replace(/\D/g, "").split(""), "*"];
  const N = 1, W = 3, Q = 10; // narrow, wide and the quiet zone, in narrow units
  let x = Q; const bars = [];
  chars.forEach((c, i) => {
    T[c].split("").forEach((e, j) => { const w = e === "w" ? W : N; if (j % 2 === 0) bars.push(`<rect x="${x}" y="6" width="${w}" height="34"></rect>`); x += w; });
    if (i < chars.length - 1) x += N;
  });
  x += Q;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x} 40" preserveAspectRatio="none" class="barcode" aria-hidden="true"><rect x="0" y="0" width="${x}" height="40" fill="#f2f2f0"></rect><g fill="#0c0c0e">${bars.join("")}</g></svg>`;
}
// long names (first and last) step down in size and may take two lines

}

    ${st.map((row) => `<tr class="${row.rank <= 4 ? "top" : ""}"><td class="rank">${row.rank}</td><td class="team">${swatch(row.team.id)}<span class="code">${h(row.team.code)}</span><span class="full">${h(row.team.name)}</span>${row.tiedWith > 1 ? (seasonDone ? `<span class="duel">Duel for ${ordinal(row.rank)}</span>` : `<span class="tied">Tied for ${ordinal(row.rank)}</span>`) : ""}</td><td>${row.w}</td><td>${row.l}</td><td>${row.kw}</td><td class="hide-sm">${row.rw}</td><td class="hide-sm">${row.rl}</td><td class="pts">${row.pts}</td><td>${money(row.spoils)}</td></tr>`).join("")}
  </tbody></table></div>

    <div class="scrollx"><table class="tbl reck"><thead><tr><th style="text-align:left">Team</th><th>Spoils</th><th>Place</th><th>Awards</th><th>Total</th><th>Envelope</th></tr></thead><tbody>
    ${RK.rows.map((x) => `<tr><td class="team">${swatch(x.team.id)}<span class="code">${h(x.team.code)}</span><span class="full">${h(x.team.name)}</span></td><td>${money(x.spoils)}</td><td>${x.place ? money(x.place) : "—"}</td><td title="${h(x.awardNames.join(", "))}">${x.awards ? money(x.awards) : "—"}</td><td class="pts">${money(x.total)}</td><td>${money(x.envelope)} <small class="muted">× ${x.roster}</small></td></tr>`).join("")}
    </tbody></table></div>
    <p class="help">After the last Gauntlet of week ${s.weeks}, everything is paid at once, bowling-sweepers style. Each team's total splits evenly across its roster, one envelope a player, rounded down to the dollar; the leftover ${RK.leftover ? `(${money(RK.leftover)} right now) ` : ""}goes to the league fund. A player who leaves forfeits his share to the sub who takes his spot and finishes the season. ${seasonDone ? "" : "Until then, spoils are what's earned so far; place money and awards show where teams stand tonight."}</p>`;

}

/* ---- TV board (a laptop or TV at the pits) ---- */
function viewTv(r, s) {
  if (!s) return `<div class="tv"><div class="tv-top">${leagueLogo("tv-logo")}</div><div class="empty">No season yet.</div><a class="btn sm ghost tv-exit" href="#board">Exit</a></div>`;
  const wk = effectiveWeek(s);
  const ms = matchesOf(s, wk);
  const pitCard = (pit) => {
    const inPit = ms.filter((m) => m.pit === pit);
    const m = inPit.find((x) => x.status === "live") || inPit.find((x) => x.status === "scheduled") || [...inPit].reverse().find((x) => x.status === "final" || x.status === "forfeit");
    if (!m) return `<div class="tv-pit"><div class="lbl"><span>Pit ${pit}</span></div><div class="state">Nothing scheduled</div></div>`;
    const v = m.status === "live" ? matchView(m) : null;
    const H = team(m.homeId), A = team(m.awayId);
    const names = (lineup, outIds, right) => v ? `<div class="inpit">${lineup.map((id) => `<span class="${outIds.has(id) ? "out" : ""}">${player(id)?.jersey ?? ""} ${pName(id)}</span>`).join("")}</div>` : "";
    return `<div class="tv-pit ${m.status === "live" ? "live" : ""}">
      <div class="lbl"><span>Pit ${pit}</span>${m.status === "live" ? `<span class="pill live">Live</span>` : m.status === "scheduled" ? `<span class="pill">Up next, slot ${m.slot}</span>` : `<span class="pill final">Final</span>`}</div>
      <div><div class="code">${swatch(m.homeId)}${h(H.code)}</div><div class="tname">${h(H.name)}</div>${names(m.homeLineup || [], v?.outIds || new Set(), false)}</div>
      <div class="rounds"><span>${m.homeRounds}</span><span class="dash">–</span><span>${m.awayRounds}</span></div>
      <div class="r"><div class="code">${h(A.code)}${swatch(m.awayId)}</div><div class="tname">${h(A.name)}</div>${names(m.awayLineup || [], v?.outIds || new Set(), true)}</div>
      <div class="state">${v ? `Round <b>${v.round}</b>, ${v.homeIn.length} v ${v.awayIn.length} in the pit, first to ${v.need}` : m.status === "scheduled" ? `Slot <b>${m.slot}</b>, up next` : `<b>${codeOf(m.winnerId)}</b> takes it`}</div>
    </div>`;
  };
  const st = standings(s);
  const featured = new Set(["A", "B"].map((pit) => { const inPit = ms.filter((m) => m.pit === pit); const m = inPit.find((x) => x.status === "live") || inPit.find((x) => x.status === "scheduled"); return m?.id; }));
  const next = ms.filter((m) => m.status === "scheduled" && !featured.has(m.id)).slice(0, 4);
  const lad = ladderOf(s, wk);
  const tkT = ladderTickets(s, wk);
  return `<div class="tv">
    <div class="tv-top">${leagueLogo("tv-logo")}<div class="wk">${(() => { const n = nightOf(s, wk); const run = [1, 2, 3, 4].map((sl) => [sl, slotClock(n, sl)]).find(([, c]) => c && c.running); return run ? `Slot ${run[0]} <span class="num" style="color:var(--strike)">${run[1].text}</span><small>Week ${wk}, ${h(fmtDate(weekDate(s, wk)))}</small>` : `Week ${wk}<small>${h(fmtDate(weekDate(s, wk)))}</small>`; })()}</div></div>

        ${next.length ? next.map((m) => scoreboard(m, false)).join("") : `<div class="muted">Gauntlets are done. Time for the Ladder.</div>`}
        <div class="section-title"><h2>The Ladder</h2><span class="sub">${lad?.winnerId ? "Final" : tkT.total + (tkT.total === 1 ? " ticket" : " tickets")}</span></div>

    <a class="btn sm ghost tv-exit" href="#board">Exit</a>

/* Every team's run through the season: opponents by week, results as they land. */
function seasonGrid(s) {
  const teams = teamsOf(s);
  const ms = matchesOf(s);
  if (!ms.length) return "";
  const weeks = Array.from({ length: s.weeks }, (_, i) => i + 1);
  const cell = (t, w) => ms.filter((m) => m.week === w && (m.homeId === t.id || m.awayId === t.id)).sort((a, b) => a.slot - b.slot).map((m) => {
    const home = m.homeId === t.id; const opp = home ? m.awayId : m.homeId;
    const mine = home ? m.homeRounds : m.awayRounds, theirs = home ? m.awayRounds : m.homeRounds;
    const done = m.status === "final" || m.status === "forfeit";
    const won = done && m.winnerId === t.id;
    return `<a href="#score/m/${h(m.id)}" class="g ${done ? (won ? "gw" : "gl") : m.status === "live" ? "glive" : ""}" title="Slot ${m.slot}, pit ${h(m.pit)}">${codeOf(opp)}${done ? `<small>${mine}–${theirs}</small>` : m.status === "live" ? `<small>live</small>` : `<small>S${m.slot}${h(m.pit)}</small>`}</a>`;
  }).join("");
  return `<div class="section-title" id="sec-grid"><h2>Season grid</h2><span class="sub">Who everyone plays, every night</span></div>
    <div class="scrollx"><table class="tbl grid"><thead><tr><th style="text-align:left">Team</th>${weeks.map((w) => `<th class="${w === effectiveWeek(s) ? "on" : ""}">W${w}</th>`).join("")}</tr></thead><tbody>
    ${teams.map((t) => `<tr><td class="team">${swatch(t.id)}<span class="code">${h(t.code)}</span></td>${weeks.map((w) => `<td class="${w === effectiveWeek(s) ? "on" : ""}">${cell(t, w)}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div>
    <p class="help">Two Gauntlets a night, read top to bottom. S1A is slot 1 in pit A. Results fill in as they land; tap one to open it.</p>`;
}

/* ---- Schedule ---- */
function viewSchedule(r, s) {
  if (!s) return `<h1>Schedule</h1>${noSeason()}`;
  const wk = UI.scheduleWeek || effectiveWeek(s);
  const ms = matchesOf(s, wk);
  let html = `<div class="section-title"><h1>Schedule</h1><span class="sub">${h(fmtDate(weekDate(s, wk)))}</span></div>` + weekTabs(s, wk, "sched-week");
  if (!ms.length) return html + `<div class="empty">No schedule yet.${isCommish() ? ` <a class="btn" href="#admin">Build it in Admin</a>` : ""}</div>`;
  for (let slot = 1; slot <= 4; slot++) {
    const sm = ms.filter((m) => m.slot === slot);
    html += `<div class="block" style="padding-top:10px"><div class="slot-h" style="margin-top:0"><h3>Slot ${slot}</h3><span class="off">${slotNote(slot)}</span></div>
      ${sm.map((m) => `<a class="sched-row" style="text-decoration:none;color:inherit" href="#score/m/${h(m.id)}"><span class="pitlbl">${h(m.pit)}</span><span class="vs"><span class="code">${swatch(m.homeId)}${codeOf(m.homeId)}</span><span class="v">v</span><span class="code">${codeOf(m.awayId)}${swatch(m.awayId)}</span>${m.status === "scheduled" ? "" : `<span class="res">${m.homeRounds}–${m.awayRounds}</span>`}${m.status === "live" ? `<span class="pill live">Live</span>` : m.status === "forfeit" ? `<span class="pill forfeit">FF</span>` : ""}</span><span class="off">${nameOf(m.homeId)} v ${nameOf(m.awayId)}</span></a>`).join("")}
    </div>`;
    if (slot === 2) html += `<div class="breakline">Ref break, 5–10 minutes</div>`;
  }
  const teams = teamsOf(s);
  html += `<div class="section-title"><h2>Your night at a glance</h2></div><div class="scrollx"><table class="tbl"><thead><tr><th style="text-align:left">Team</th><th>Plays</th><th>Off</th></tr></thead><tbody>
    ${teams.map((t) => { const on = ms.filter((m) => m.homeId === t.id || m.awayId === t.id).map((m) => m.slot); const off = [1, 2, 3, 4].filter((x) => !on.includes(x)); return `<tr><td class="team">${swatch(t.id)}<span class="code">${h(t.code)}</span>${h(t.name)}</td><td>${on.map((x) => "slot " + x).join(", ")}</td><td>${off.map((x) => "slot " + x).join(", ")}</td></tr>`; }).join("")}
  </tbody></table></div>
  <p class="help">Every team runs two Gauntlets a night, one in each half, with King of the Pit right after each. League refs run the pits; they aren't on any team. The Ladder closes the night. Seven nights, every team meets every other team twice.</p>`;
  return html;
}

/* ---- How to play ---- */
function viewPlay() {
  return `<div class="doc">
    <h1 class="sr">How to play</h1>
    <img class="hero-logo" src="${LOGO_BIG}" alt="Gauntlet Ball">
    <p class="lede">A pit, a ball, your palms. Hit the ball into the other team. Anywhere neck-down and you're out. Last team standing takes the round.</p>
    <div class="callrow">
      <div class="call"><b>Walls.</b>Hand on the wall. The ref drops the ball.</div>
      <div class="call"><b class="red">This is Gauntlet!</b>Shout it on the second and third bounce. Hands off on the word. Ball's live.</div>
      <div class="call"><b>Out means out.</b>Neck and below, one hit, through the gate, behind No Man's Land.</div>
    </div>
    <h2>The pit</h2>
    <p>Eight walls, 4 feet tall, about 20 feet across, two teams of five inside. The walls are part of the game: bank a shot off one and it still counts. The 10 ft pit next door is for King of the Pit, the Ladder and honor duels. The three-foot strip around the outside of every wall is <span class="term">No Man's Land</span>: nobody stands in it while a round is live.</p>
    <h2>Hitting</h2>
    <p>Only the palm of your hand touches the ball. No fists, no fingertips, no scooping, no holding, no throwing, no catching. You get two shots:</p>
    <ul>
      <li><span class="term">1-Hand Cannon</span> One palm, straight through the ball. The quickest shot in the pit.</li>
      <li><span class="term">2-Hand Cannon</span> Both palms, one motion. The heavy shot. Nothing from underneath, no stopping it first.</li>
      <li><span class="term">Whip</span> One open hand dragged across the ball. The drag puts spin on it, the spin bends it off the wall. Fingers under the ball is a scoop and you're out.</li>
      <li><span class="term">180° Spinning Whip</span> A whip thrown through a half turn before you touch the ball.</li>
      <li><span class="term">360° Spinning Whip</span> The full turn. Same rules as a whip, all style.</li>
    </ul>
    <p>Nobody logs which strike you used. Pick your preferred strike on your profile; the scorekeeper only logs who put who out.</p>
    <p>You can't hit the ball twice in a row. It has to touch a wall or another player in between. A teammate's palms count, so passing is legal: hunting in pairs is how good teams play.</p>
    <h2>Getting out</h2>
    <p>If the ball touches you anywhere from the neck down, you're out. One hit. It doesn't matter who hit it: a teammate's shot, your own rebound off the wall, your own foot. The ball doesn't know whose team you're on. Head contact is nothing, the ball stays live.</p>
    <p>When you're out, leave the pit right away through the gate and stand behind No Man's Land. Don't touch the wall, don't touch a ball that's still in play. You can catch a ball that leaves the pit, clean, on the fly, feet behind the line. It doesn't put you back in, but catches count toward a season award.</p>
    <h2>Rounds and Gauntlets</h2>
    <p>A round ends the instant a team's last player is out. A Gauntlet is best of seven, first to four rounds. If the ball leaves the pit, nobody's out: the ref restarts play with a jump ball.</p>
    <h2>Jump balls</h2>
    <p>The ref's way to keep play moving. A dead ball, or a small call between two players, restarts with a jump ball. It's never an out. Each team picks a jumper (on a disputed call, the two players involved jump). Everyone else puts a hand on the wall. The ref puts the ball up between the jumpers, and on the tip the ball is live. Whoever tipped it can't touch it again until it hits a wall or another player.</p>
    <h2>King of the Pit</h2>
    <p>Right after every Gauntlet, the two players who sat it out meet in the 10 ft pit, one on one, best of three. Win it and your team gets a standings point and spoils. Nobody duels twice in a night, so a team of five sends someone who just played. You know who you're playing, so plan who sits.</p>
    <h2>The Ladder</h2>
    <p>The last thing every night. Every loss tonight, Gauntlets and King of the Pit, earns a ticket: sixteen on a full night. Your last man standing from a lost Gauntlet holds one automatically; your team votes on the rest. A one-on-one bracket in the 10 ft pit, one round a duel, the final best of three. Win it and your team takes the Ladder prize. The more you lost tonight, the more shots you get. It's called redemption for a reason.</p>
    <h2>The night</h2>
    <p>Two halves. In each half every team runs one Gauntlet with King of the Pit right after, and sits one slot out. A 5–10 minute ref break between halves, then the Ladder closes the night. About two and a half hours, start to finish.</p>
    <h2>Your first night</h2>
    <ul>
      <li>Show up 15 minutes before slot 1 and check in at the league table. Turn in your signed waiver with the ${money(DEFAULT_SETTINGS.gearFee)} sign-up fee. Check the <a href="#schedule">schedule</a> for your slots.</li>
      <li>Wear your team sleeve on your striking arm, every time you're in a pit. It stops at the wrist.</li>
      <li>Wear shoes you can cut in. Shorts or pants, your call: the ball is soft but the ground isn't.</li>
      <li>Hurt? Tell the ref, play stops. First-aid kits, water, Gatorade and cut fruit are at the league table all night.</li>
      <li>Your captain sets the lineup: five in, one on the bench. The bench player duels King of the Pit. Subs swap between rounds only.</li>
      <li>Can't make a night? Send a fill-in. They play under your name and earn for you, and they sign the waiver first.</li>
      <li>When your team is off, you're catching in No Man's Land or watching. League refs run the pits; nobody refs their own friends.</li>
      <li>Fee is ${money(DEFAULT_SETTINGS.teamFee)} a team a night (${money(DEFAULT_SETTINGS.teamFee / 6)} a head), collected by your captain. Nothing is paid out on league nights: wins add to your team's spoils, and everything is paid at the Reckoning after week ${DEFAULT_SETTINGS.weeks}.</li>
    </ul>
  </div>`;
}

async function downloadWaiver() {
  const name = "Gauntlet-Ball-Waiver.pdf";
  const bin = atob(WAIVER_PDF_B64); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], { type: "application/pdf" });
  // inside the claude.ai preview, files go through the viewer's save prompt
  if (window.claude && typeof window.claude.use === "function") {
    try {
      const dl = await window.claude.use("downloads");
      if (dl) { await dl.save({ filename: name, data: blob }); toast("Waiver saved"); return; }
    } catch (e) { if (e && e.code === "declined") return; }
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { window.open("data:application/pdf;base64," + WAIVER_PDF_B64, "_blank"); }
}

  html += `<div class="block flat"><h3>Diagnostics</h3><p class="muted" style="margin:6px 0 0">App v${APP_VERSION}, ${store.mode === "demo" ? "demo" : "live"}, ${h(navigator.userAgent.slice(0, 90))}</p>${ERRS.length ? `<p class="error" style="margin-top:6px">${ERRS.map(h).join("<br>")}</p>` : `<p class="help">No errors this session.</p>`}</div>`;
  if (store.mode === "demo") html += `<div class="block flat"><h3>Demo data</h3><div class="btnrow" style="margin-top:10px"><button class="btn" data-action="reset-demo">Reset the sample league</button><button class="btn ghost" data-action="wipe">Start empty</button></div></div>`;
  return html + install;
}

/* Setup checklist: the order a new league gets built in, with the next step lit up. */
function setupChecklist(s) {
  const teams = s ? teamsOf(s) : [];
  const roster = teams.map((t) => playersOf(t.id).length);
  const ms = s ? matchesOf(s) : [];
  const unplaced = (S.profiles || []).filter((p) => !S.players.some((x) => x.profileId === p.id));
  const rostered = teams.flatMap((t) => playersOf(t.id));
  const steps = [
    { k: "season", label: "Season", done: !!s, note: s ? h(s.name) + ", " + fmtDate(s.startDate) : "Name it, pick the first night" },
    { k: "teams", label: "8 teams", done: teams.length === 8, note: teams.length + " of 8" },
    { k: "teams", label: "Rosters", done: teams.length === 8 && roster.every((n) => n >= 4), note: teams.length ? roster.filter((n) => n >= 4).length + " of 8 teams have four or more" : "Add players, six a team" },
    { k: "schedule", label: "Schedule", done: ms.length > 0, note: ms.length ? ms.length + " Gauntlets over " + s.weeks + " nights" : "Builds itself when the 8th team is in" },
    { k: "roles", label: "Accounts", done: !!s && unplaced.length === 0, note: unplaced.length ? unplaced.length + " waiting for a team" : (S.profiles || []).length + " account" + ((S.profiles || []).length === 1 ? "" : "s") + ", all placed" },
    { k: "teams", label: "Waivers and fees", done: rostered.length > 0 && rostered.every((p) => p.waiverAt), note: rostered.length ? rostered.filter((p) => p.waiverAt).length + " of " + rostered.length + " in" : "Turned in together before the first night" },
  ];
  const next = steps.find((x) => !x.done);
  return `<div class="setup"><div class="setup-steps">${steps.map((x) => `<button class="step ${x.done ? "done" : ""} ${x === next ? "next" : ""}" data-action="admin-tab" data-tab="${x.k}"><span class="st-mark">${x.done ? "✓" : ""}</span><span class="st-l">${h(x.label)}</span><span class="st-n">${x.note}</span></button>`).join("")}</div>${next ? `<div class="setup-next">Next: ${h(next.label.toLowerCase())}. ${next.note}.</div>` : `<div class="setup-next done">Setup is complete. Night one runs from Score.</div>`}</div>`;
}

  }
  return html;
}

/* ---------- event handling ---------- */
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  if (el.matches(".sheet-bg") && e.target !== el) return; // click inside the sheet
  const a = el.dataset.action;
  const s = season();
  if (navigator.vibrate && /^(out-pick|out-save|g-out|checkin)$/.test(a)) { try { navigator.vibrate(8); } catch (x) {} }
  try {
    switch (a) {
      case "sheet-close": UI.sheet = null; UI.sheetState = null; render(); break;
      case "incident-new": incidentSheet(s, Number(el.dataset.week), el.dataset.match || null); render(); break;
      case "incident-delete": if (isAdmin() && confirm("Delete this write-up? There's no undo.")) await store.remove("incidents", el.dataset.id); break;
      case "print": window.print(); break;
      case "score-week": UI.scoreWeek = Number(el.dataset.week); render(); break;
      case "sched-week": UI.scheduleWeek = Number(el.dataset.week); render(); break;
      case "admin-tab": UI.adminTab = el.dataset.tab; render(); break;
      case "admin-go": UI.adminTab = el.dataset.tab || "season"; if (location.hash === "#admin") render(); else location.hash = "#admin"; break;
      case "auth-tab": UI.authTab = el.dataset.tab; UI.authError = null; UI.authNote = null; render(); break;
      case "view-as": await store.setViewAs(el.dataset.role); toast("Viewing as " + el.dataset.role); break;
      case "reset-demo": if (confirm("Replace everything with the sample league?")) { await store.resetDemo(); toast("Sample league restored"); } break;
      case "wipe": if (!isAdmin()) break; if (confirm("Delete the season, teams, schedule and every result on this device?")) { await store.wipe(); location.hash = "#admin"; toast("Cleared"); } break;
      case "sign-out": UI.authTab = "signin"; UI.authError = null; UI.authNote = null; UI.ref = null; saveRef(); await store.auth.signOut(); location.hash = "#account"; render(); break;
      case "show-pw": UI.showPw = true; render(); break;
      case "print": window.print(); break;
      case "card-flip": {
        // toggled on the element itself so the turn animates; a re-render keeps the side via UI.cardBack
        const fc = el.classList.contains("flipcard") ? el : document.querySelector(".flipcard");
        if (!fc) break;
        fc.classList.toggle("flipped"); UI.cardBack = fc.classList.contains("flipped"); fc.setAttribute("aria-pressed", String(UI.cardBack));
        break;
      }
      case "cards-side": UI.cardsSide = el.dataset.side; render(); break;
      case "waiver-pdf": downloadWaiver(); break;
      case "officer": { const o = (s?.officers || [])[Number(el.dataset.i)]; if (o) officerSheet(o); break; }
      case "ref-unlock": {
        if (!me()) { toast("Sign in first, then enter the ref PIN"); location.hash = "#account"; break; }
        UI.sheet = { kind: "ref", html: `<h2>Ref PIN</h2><p class="muted" style="margin:-4px 0 12px">The night's PIN from the commissioner. This phone then scores until the night is over or the PIN changes.</p>
          <form data-form="ref-pin"><label class="f" for="f-refpin">PIN</label><input class="f" id="f-refpin" name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" required autocomplete="one-time-code" style="font-family:var(--display);font-size:28px;letter-spacing:.3em;text-align:center">
          ${UI.refError ? `<div class="error">${h(UI.refError)}</div>` : ""}<div class="btnrow" style="margin-top:12px"><button class="btn strike" type="submit">Unlock scoring</button><button class="btn ghost" type="button" data-action="sheet-close">Cancel</button></div></form>` };
        UI.refError = null; UI.focus = "#f-refpin"; render(); break;
      }
      case "ref-lock": UI.ref = null; saveRef(); toast("Locked. Tap Ref to score again."); break;
      case "ref-info": UI.sheet = { kind: "refinfo", html: `<h2>Ref mode</h2><p class="muted">This phone can score until ${h(new Date(UI.ref.until).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }))}, or until the commissioner changes the PIN.</p><div class="btnrow" style="margin-top:12px"><button class="btn" data-action="ref-lock">Lock this phone</button><button class="btn ghost" data-action="sheet-close">Close</button></div>` }; render(); break;
      case "pin-change": UI.showPin = true; UI.focus = "#f-pin"; render(); break;
      case "pin-cancel": UI.showPin = false; render(); break;
      case "accent": { const k = el.dataset.accent; try { localStorage.setItem(ACCENT_KEY, k); } catch (e) {} await applyAccent(k, true); toast((ACCENTS.find((a) => a.k === k) || ACCENTS[0]).name + " it is"); break; }
      case "jump": { const t = document.getElementById(el.dataset.target); if (!t) break; document.querySelectorAll(".secnav button").forEach((b) => b.classList.toggle("on", b === el)); glideTo(t); break; }
      case "player-media": { const p = player(el.dataset.id); if (!p || !isCommish()) break; const next = p.mediaOk === true ? false : p.mediaOk === false ? null : true; await store.update("players", p.id, { mediaOk: next }); toast(next === true ? "Media: yes" : next === false ? "Media: no, sticker their face" : "Media: not answered"); break; }
      case "player-waiver": { const p = player(el.dataset.id); if (!p) break; await store.update("players", p.id, { waiverAt: p.waiverAt ? null : new Date().toISOString() }); toast(p.waiverAt ? "Waiver and fee cleared" : "Waiver and fee in"); break; }
      case "auth-reset": {
        const email = document.getElementById("f-email")?.value;
        if (!email) { UI.authError = "Enter your email first, then tap Forgot password."; render(); break; }
        await store.auth.reset(email); UI.authError = null; UI.authNote = "Check your email for a reset link."; render(); break;
      }
      /* scoring */
      case "start-match": { const m = S.matches.find((x) => x.id === el.dataset.id); if (m && canScore()) await startMatch(m); break; }
      case "toggle-lineup": {

      const lines = g("list").split(/\n+/).map((l) => l.trim()).filter(Boolean);
      const rows = lines.map((l, i) => { const m = l.match(/^(.*?)[,\t]\s*#?(\d{1,2})\s*$/); const name = (m ? m[1] : l).trim(); const jersey = m ? Number(m[2]) : null; return { teamId, name, jersey, captain: ros.length === 0 && i === 0, profileId: null }; }).filter((r) => r.name);
      if (!rows.length) return;
      if (store.mode === "demo") { for (const r of rows) await store.insert("players", r); } else await store.insertMany("players", rows);
      UI.pasteTeam = null; toast(rows.length + " added"); render();
    }
    if (kind === "player") { const teamId = f.dataset.team; const ros = playersOf(teamId); if (ros.length >= 6 && !confirm("Rosters are six. Add a seventh anyway?")) return; await store.insert("players", { teamId, name: g("name"), jersey: g("jersey") ? Number(g("jersey")) : null, captain: ros.length === 0, profileId: null }); f.reset(); UI.focus = `#p-name-${teamId}`; render(); }
  } catch (err) { console.error(err); toast(err.message || "Something went wrong"); }
});
window.addEventListener("hashchange", () => { UI.sheet = null; UI.sheetState = null; UI.editLineups = null; UI.cardBack = false; window.scrollTo(0, 0); render(); });

/* ---------- boot ---------- */
(async function boot() {
  UI.loading = true;
  loadRef();
  app.innerHTML = loaderHtml();
  const accentReady = applyAccent(accentNow(), false);
  let fast = false;
  try { fast = sessionStorage.getItem("gb.loaded") === "1"; } catch (e) {}
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) fast = true;
  const anim = playLoader(fast);
  const live = CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY;
  store = live ? new SupabaseStore(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : new LocalStore();
  store.subscribe(() => { S = store.all(); render(); });
  let initErr = null;
  try { await store.init(); } catch (err) { console.error(err); initErr = err; }
  await anim;
  await accentReady;
  try { sessionStorage.setItem("gb.loaded", "1"); } catch (e) {}
  UI.loading = false;
  if (initErr) {
    app.innerHTML = `<main><div class="empty"><h2>Couldn't start</h2><p>${h(initErr.message)}</p><p class="muted">If this is a live deployment, check the Supabase URL and key at the top of the file and that the schema has been run.</p></div></main>`;
    return;
  }
  S = store.all();
  render();
  if (UI.note) { toast(UI.note); UI.note = null; }
})();
</script>
