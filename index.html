<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gauntlet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>Trailblazer League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --pit:#0c0c0e; --ash:#151518; --coal:#1d1d22; --line:#2b2b32; --line-soft:#232329;
  --chalk:#f2f2f0; --steel:#9a9fa6; --dim:#6b6f76;
  --strike:#e3001b; --strike-deep:#a80014; --strike-ink:#ffffff; --strike-hi:#ff1a33; --strike-tint:#2a1216; --strike-rgb:227,0,27;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --nav-h:64px; --top-h:58px; --rail-w:200px;
  color-scheme:dark;
}
/* Accent themes: the red can be swapped per device for anyone who can't see it well; the logos are re-inked to match at runtime. */
:root[data-accent="blue"]{--strike:#2f7dff;--strike-deep:#1f5fd0;--strike-ink:#ffffff;--strike-hi:#4d90ff;--strike-tint:#121a2e;--strike-rgb:47,125,255}
:root[data-accent="green"]{--strike:#22c55e;--strike-deep:#178f44;--strike-ink:#0c0c0e;--strike-hi:#3ad574;--strike-tint:#0f2518;--strike-rgb:34,197,94}
:root[data-accent="purple"]{--strike:#a06bff;--strike-deep:#7a48d9;--strike-ink:#ffffff;--strike-hi:#b283ff;--strike-tint:#1e1530;--strike-rgb:160,107,255}
:root[data-accent="yellow"]{--strike:#ffc400;--strike-deep:#cc9c00;--strike-ink:#0c0c0e;--strike-hi:#ffd23d;--strike-tint:#2a2410;--strike-rgb:255,196,0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pit);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh}
a{color:var(--chalk)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.05;margin:0}
h1{font-size:34px;letter-spacing:.005em}
h2{font-size:26px}
h3{font-size:20px}
p{margin:0 0 12px}
.muted{color:var(--steel)}
.dim{color:var(--dim)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top-h);background:var(--pit);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:30}
.topbar .logo{height:38px;width:auto}
.topbar .logo-link{display:flex;align-items:center;gap:10px;text-decoration:none}
.topbar .who{display:flex;align-items:center;gap:10px}
.weekpill{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--steel);border:1px solid var(--line);padding:5px 10px;border-radius:999px;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--coal);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:14px;color:var(--chalk);text-decoration:none}
.avatar.role-admin{border-color:var(--strike)}
.avatar.role-support{border-color:var(--chalk)}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--pit);border-top:1px solid var(--line-soft);display:flex;z-index:30}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--steel);font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.03em;min-height:44px}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--chalk)}
.nav a.on svg{stroke:var(--strike)}
.nav a.more-only{display:flex}
.nav a.rail-only{display:none}

main{padding:calc(var(--top-h) + 18px) 16px calc(var(--nav-h) + 34px);max-width:1080px;margin:0 auto}
@media (min-width:900px){
  .nav{top:var(--top-h);bottom:0;left:0;right:auto;width:var(--rail-w);height:auto;flex-direction:column;border-top:0;border-right:1px solid var(--line-soft);padding:14px 10px}
  .nav a{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;font-size:16px;border-radius:8px}
  .nav a.on{background:var(--ash)}
  .nav a.more-only{display:none}
  .nav a.rail-only{display:flex}
  main{margin-left:var(--rail-w);padding:calc(var(--top-h) + 28px) 36px 60px;max-width:none}
  .wrap{max-width:1040px}
}

/* generic blocks */
.block{background:var(--ash);border:1px solid var(--line-soft);border-radius:10px;padding:16px;margin:0 0 14px}
.block.flat{background:transparent;border-color:var(--line)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.grid2>*{min-width:0}
@media (min-width:720px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;margin:22px 0 10px;flex-wrap:wrap}
.section-title h1,.section-title h2{flex:none}
.section-title:first-child{margin-top:0}
.section-title h2{font-size:22px}
.section-title .sub{color:var(--steel);font-size:14px}
hr.rule{border:0;border-top:1px solid var(--line-soft);margin:14px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--coal);color:var(--chalk);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--steel)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible{outline:2px solid var(--strike);outline-offset:2px}
.btn.strike{background:var(--strike);border-color:var(--strike);color:var(--strike-ink)}
.btn.strike:hover{background:var(--strike-hi)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:15px}
.btn.big{min-height:56px;font-size:20px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

/* forms */
label.f{display:block;font-size:14px;color:var(--steel);margin:0 0 6px}
input.f,select.f,textarea.f{width:100%;min-height:44px;padding:8px 12px;background:var(--coal);border:1px solid var(--line);border-radius:8px;color:var(--chalk)}
input.f.short{width:110px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1 / -1}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.help{font-size:14px;color:var(--steel);margin:6px 0 0}
.error{color:#ff6b7a;font-size:14px;margin:8px 0 0}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--steel);text-transform:uppercase}
.pill.live{border-color:var(--strike);color:var(--chalk)}
.pill.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--strike);animation:pulse 1.2s ease-in-out infinite}
.pill.final{background:var(--coal);color:var(--chalk)}
.pill.forfeit{border-color:#7a3a3a;color:#d08a8a}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.live::before{animation:none}}

/* scoreboard */
.sb{background:var(--ash);border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-decoration:none;color:inherit}
.sb.live{border-color:var(--strike)}
.sb .side{display:flex;flex-direction:column;gap:2px;min-width:0}
.sb .side.r{text-align:right;align-items:flex-end}
.sb .code{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em;line-height:1}
.sb .tname{font-size:13px;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sb .score{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.sb .score .dash{color:var(--dim);font-size:28px}
.sb .meta{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--steel);padding-top:8px;border-top:1px solid var(--line-soft)}
.sb .meta .pit{font-family:var(--display);font-weight:700;letter-spacing:.06em;color:var(--chalk)}
.swatch,.sb .swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle;box-shadow:0 0 0 1px rgba(242,242,240,.35)}
.slot-h{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 8px}
.slot-h h3{font-size:18px}
.slot-h .off{font-size:13px;color:var(--steel)}

/* big live board on match screen */
.board{background:var(--ash);border:1px solid var(--line-soft);border-radius:12px;padding:18px 16px;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:14px}
.board.live{border-color:var(--strike)}
.board .side{min-width:0}
.board .side.r{text-align:right}
.board .code{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.04em;line-height:1}
.board .tname{color:var(--steel);font-size:14px}
.board .rounds{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px}
.board .rounds .dash{color:var(--dim);font-size:44px}
.board .state{grid-column:1 / -1;text-align:center;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.08em;color:var(--steel);text-transform:uppercase}
.board .state b{color:var(--chalk)}
.callout{text-align:center;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.04em;color:var(--chalk);margin:4px 0 14px}
.callout span{color:var(--strike)}

/* player chips (scoring) */
.pit-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.pit-col{min-width:0}
.pit-col h3{font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.pit-col h3 small{color:var(--steel);font-family:var(--body);font-weight:500;font-size:13px}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--coal);text-align:left;width:100%;color:var(--chalk)}
.chip .jn{font-family:var(--display);font-weight:800;font-size:22px;width:34px;flex:0 0 auto;text-align:center;font-variant-numeric:tabular-nums}
.chip .pn{flex:1;min-width:0;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
@media (max-width:600px){.chip .how.hint{display:none}.chip{padding:6px 8px;gap:8px}.chip .jn{width:28px;font-size:19px}}
.chip .cap{font-family:var(--display);font-size:12px;letter-spacing:.08em;color:var(--strike);border:1px solid var(--strike);border-radius:4px;padding:1px 5px}
.chip.out{opacity:.45;background:transparent;border-style:dashed}
.chip.out .pn{text-decoration:line-through}
.chip .how{font-family:var(--display);font-weight:700;font-size:13px;color:var(--steel);letter-spacing:.04em}
.chip.pick{border-color:var(--steel)}
.chip.pick:hover{border-color:var(--chalk)}
.chip.sel{border-color:var(--strike);background:var(--strike-tint)}

/* standings table */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
.tbl th{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;color:var(--steel);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td.team{text-align:left;font-weight:600}
.tbl td.team .code{font-family:var(--display);font-weight:800;letter-spacing:.04em;margin-right:8px}
.tbl td.pts{font-family:var(--display);font-weight:800;font-size:20px}
.tbl tr.top td:first-child{box-shadow:inset 3px 0 var(--strike)}
.tbl .rank{color:var(--steel);font-family:var(--display);font-weight:700;width:26px}
.tbl .duel{font-family:var(--display);font-size:12px;letter-spacing:.08em;color:var(--strike);border:1px solid var(--strike);border-radius:4px;padding:1px 5px;margin-left:6px}
.tbl .tied{font-family:var(--display);font-size:12px;letter-spacing:.08em;color:var(--steel);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px}
@media (max-width:600px){.hide-sm{display:none}.tbl td.team .full{display:none}.tbl th,.tbl td{padding:10px 6px}}
.tag{display:inline-flex;align-items:center;font-weight:600;font-size:14px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--chalk)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* leaders */
.leaders{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.leaders{grid-template-columns:repeat(2,minmax(0,1fr))}}
.leader{background:var(--ash);border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px}
.leader h3{font-size:16px;margin-bottom:8px;display:flex;justify-content:space-between}
.leader h3 .prize{color:var(--steel);font-weight:600;font-family:var(--body);font-size:13px}
.leader ol{margin:0;padding:0;list-style:none}
.leader li{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-top:1px solid var(--line-soft);gap:10px}
.leader li:first-child{border-top:0}
.leader li .n{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.leader li .who{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leader li .who small{color:var(--steel);margin-left:6px}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--ash);border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px}
.tile .v{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .l{color:var(--steel);font-size:13px;margin-top:4px}

/* schedule */
.weektabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.weektabs button,.weektabs a{flex:0 0 auto;min-width:48px;min-height:40px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--steel);font-family:var(--display);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;text-decoration:none}
.weektabs button.on,.weektabs a.on{background:var(--chalk);color:var(--pit);border-color:var(--chalk)}
.weektabs button.tonight{border-color:var(--strike)}
.weektabs.wrap{flex-wrap:wrap;overflow:visible}
.sched-row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-soft)}
.sched-row .pitlbl{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.06em;width:38px}
.sched-row .vs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sched-row .vs .code{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.04em}
.sched-row .vs .v{color:var(--dim);font-family:var(--display)}
.sched-row .res{font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;margin-left:auto}
.sched-row .off{grid-column:2;font-size:13px;color:var(--steel)}

/* teams */
.teamcard{background:var(--ash);border:1px solid var(--line-soft);border-radius:10px;padding:14px;border-left:4px solid var(--line)}
.teamcard h3{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.teamcard h3 .btn{font-size:13px;min-height:30px;padding:0 10px}
.teamcard h3 .code{font-size:14px;letter-spacing:.08em;color:var(--steel)}
.roster{margin:0;padding:0;list-style:none}
.roster li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line-soft);min-width:0;flex-wrap:wrap}
.roster li>span:nth-child(2){flex:1 1 110px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster li .btn.sm{min-height:32px;padding:0 10px;font-size:14px;flex:0 0 auto}
.roster li .jn{font-family:var(--display);font-weight:800;width:30px;text-align:center;font-variant-numeric:tabular-nums}
.roster li .cap{font-family:var(--display);font-size:12px;letter-spacing:.08em;color:var(--strike);border:1px solid var(--strike);border-radius:4px;padding:1px 5px}
.roster li .me{font-size:12px;color:var(--steel);margin-left:auto}

/* docs (play, rules, faq) */
/* press feedback: every tappable thing dips and brightens while it's held (plain :active; iOS applies it once the page listens for touches) */
.btn,.chip,.nav a,.weektabs button,.weektabs a,.seg button,.secnav button,.menu-row,.step,.th,.swatches button,.accent-swatch,.sb,.card-link,.flipcard{-webkit-tap-highlight-color:transparent;transition:transform .08s ease,filter .08s ease,background-color .12s ease,border-color .12s ease}
.btn:active,.chip:active,.weektabs button:active,.weektabs a:active,.seg button:active,.secnav button:active,.step:active,.th:active,.swatches button:active,.accent-swatch:active{transform:scale(.96);filter:brightness(1.3)}
.btn.strike:active{filter:brightness(1.12)}
.nav a:active{transform:scale(.9);filter:brightness(1.4)}
.menu-row:active,.sb:active{transform:scale(.985);background:var(--coal)}
.flipcard:active,.card-link:active{transform:scale(.985);filter:brightness(1.08)}
@media (prefers-reduced-motion:reduce){.btn:active,.chip:active,.nav a:active,.weektabs button:active,.secnav button:active,.menu-row:active,.sb:active,.flipcard:active,.card-link:active{transform:none}}
/* on-page section nav for long pages, sticks under the top bar */
.secnav{position:sticky;top:var(--top-h);z-index:20;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:8px 16px;background:var(--pit);border-bottom:1px solid var(--line-soft)}
.secnav::-webkit-scrollbar{display:none}
.secnav button{flex:0 0 auto;min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--coal);color:var(--steel);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.03em}
.secnav button.on{color:var(--chalk);border-color:var(--chalk);background:var(--ash)}
@media (min-width:900px){.secnav{margin:0 -36px 10px;padding:8px 36px}}
.section-title,.secnav-anchor{scroll-margin-top:calc(var(--top-h) + 64px)}
/* ref PIN */
.pinshow{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:.3em;font-variant-numeric:tabular-nums;line-height:1}
.weekpill.refpill{border-color:var(--strike);color:var(--strike);background:transparent;cursor:pointer;font-size:13px;letter-spacing:.14em}
/* accent picker */
.accents{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.accent-swatch{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:64px;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--coal);color:var(--steel);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.03em}
.accent-swatch i{width:26px;height:26px;border-radius:50%;background:var(--sw);display:block;box-shadow:0 0 0 2px var(--pit)}
.accent-swatch[aria-pressed="true"]{border-color:var(--chalk);color:var(--chalk)}
.accent-swatch[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--pit),0 0 0 4px var(--chalk)}
/* site footer */
.foot{max-width:1080px;margin:34px auto 0;padding:14px 0 0;border-top:1px solid var(--line-soft);color:var(--steel);font-size:12.5px;line-height:1.55}
.foot a{color:var(--steel);text-decoration:underline;text-underline-offset:2px}
.foot .sep{margin:0 6px;opacity:.6}
/* the waiver, laid out like the paper it prints as */
.paper{background:var(--ash);border:1px solid var(--line-soft);border-radius:12px;padding:22px 20px;margin-top:6px}
.paper-head{display:flex;align-items:center;gap:16px;padding-bottom:14px;border-bottom:2px solid var(--strike);margin-bottom:14px}
.paper-head img{width:110px;height:auto;flex:0 0 auto}
.paper-title{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05}
.paper-sub{color:var(--steel);font-size:14px;margin-top:4px}
.paper-warn{font-weight:700;color:var(--strike)}
.doc.waiver .paper h3{font-size:17px;margin:16px 0 4px}
.doc.waiver .paper p{font-size:15.5px;line-height:1.5;margin:0 0 6px}
.paper-ack{font-weight:700;margin-top:14px !important}
.sigs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px 24px;margin:22px 0 8px}
.sig.wide{grid-column:span 2}
.sig{border-bottom:1.5px solid var(--chalk);height:40px;display:flex;align-items:flex-start}
.sig .lab{font-size:11.5px;color:var(--steel);letter-spacing:.04em;text-transform:uppercase}
.paper-office{color:var(--steel);font-size:13px !important;margin-top:10px !important}
.paper-foot{color:var(--steel);font-size:12px !important;margin-top:12px !important}
@media (max-width:480px){.sigs{grid-template-columns:1fr;gap:22px}.sig.wide{grid-column:auto}}
.nowaiver{color:var(--strike)}
.doc{max-width:720px}
.doc h2{margin:26px 0 10px;font-size:24px}
.doc h3{margin:18px 0 6px;font-size:18px}
.doc p,.doc li{font-size:17px;line-height:1.55}
.doc ul,.doc ol{padding-left:22px;margin:0 0 12px}
.doc li{margin-bottom:6px}
.rule{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:17px;line-height:1.5}
.rule .no{font-family:var(--display);font-weight:800;color:var(--steel);font-variant-numeric:tabular-nums}
.term{display:inline-block;font-family:var(--display);font-weight:800;letter-spacing:.04em;font-size:15px;background:var(--coal);border:1px solid var(--line);border-radius:4px;padding:1px 6px;vertical-align:baseline}
.faq details{border-top:1px solid var(--line-soft);padding:10px 0}
.faq summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:32px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--display);font-size:24px;color:var(--steel)}
.faq details[open] summary::after{content:"–"}
.faq details p{margin:8px 0 2px;color:#d7d8d6}
.hero-logo{width:min(560px,92%);margin:0 auto 10px}
.lede{font-size:19px;color:#d7d8d6;max-width:620px;margin-bottom:16px}
.callrow{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0 18px}
@media (min-width:640px){.callrow{grid-template-columns:repeat(3,minmax(0,1fr))}}
.call{background:var(--ash);border:1px solid var(--line-soft);border-radius:10px;padding:14px}
.call b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em;display:block;margin-bottom:4px}
.call b.red{color:var(--strike)}

/* sheet / modal */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.sheet-bg{align-items:center}}
.sheet{background:var(--ash);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:720px){.sheet{border-radius:14px}}
.sheet h2{font-size:22px;margin-bottom:10px}
.sheet .chips.sheet-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.sheet .chips.sheet-grid .chip{min-height:50px}
.sheet .chips.sheet-grid .chip.wide{grid-column:1 / -1}
.sheet .chips.sheet-grid .chip .how{font-size:12px}
.menu{display:flex;flex-direction:column;border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;background:var(--ash)}
.menu-row{display:flex;align-items:center;gap:14px;padding:12px 14px;text-decoration:none;color:var(--chalk);min-height:60px;border-top:1px solid var(--line-soft)}
.menu-row:first-child{border-top:0}
.menu-row:hover{background:var(--coal)}
.menu-row .mi{width:40px;height:40px;border-radius:10px;background:var(--coal);display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.menu-row .mi svg{width:22px;height:22px;stroke:var(--chalk);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu-row .ml{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.menu-row .ml b{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.02em}
.menu-row .ml small{color:var(--steel);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-row .mc{color:var(--dim);font-size:26px;line-height:1;font-family:var(--display)}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.hitbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.hitbtns .btn{min-height:64px;font-size:22px;flex-direction:column;gap:2px}
.hitbtns .btn small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--steel);letter-spacing:0}
.hitbtns .btn.strike small{color:var(--strike-ink);opacity:.8}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));background:var(--chalk);color:var(--pit);font-weight:600;padding:10px 16px;border-radius:999px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.5);pointer-events:none}
@media (min-width:900px){.toast{bottom:24px;left:calc(50% + var(--rail-w)/2)}}

/* banners */
.banner{border:1px solid var(--line);border-left:4px solid var(--strike);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:15px;background:var(--ash)}
.banner.quiet{border-left-color:var(--steel)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;color:var(--steel)}
.empty .btn{margin-top:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--steel)}
.kv dd{margin:0}
/* King of the Pit */
.koh-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px}
.koh-row .dash{font-family:var(--display);font-weight:800;font-size:28px;color:var(--dim);padding-top:26px}
.koh-side{display:flex;flex-direction:column;gap:4px;min-width:0}
.koh-side .code{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.06em}
.koh-side .who{font-size:15px;min-height:20px;overflow-wrap:anywhere}
.koh-side .who .mini{display:block;margin:2px 0 0}
.koh-side .games{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.koh-side.won .games{color:var(--strike)}
.koh-side .btn{align-self:flex-start}
.block.koh .state{margin-top:10px;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--steel)}
/* the Ladder */
.ticketrow{border-left:4px solid var(--line);padding:8px 0 8px 12px;margin:8px 0;background:var(--ash);border-radius:0 10px 10px 0}
.ticketrow .tt{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.ticketrow .tag small{margin-left:6px;color:var(--steel);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.ticketrow .tag .x{background:none;border:0;color:var(--steel);margin-left:6px;cursor:pointer;font-size:12px;padding:0}
.bracket{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.bcol{flex:0 0 190px;display:flex;flex-direction:column;justify-content:space-around;gap:10px;scroll-snap-align:start}
.bh{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--steel)}
.bm{display:flex;flex-direction:column;gap:3px;background:var(--ash);border:1px solid var(--line);border-radius:10px;padding:4px}
.bp{display:flex;align-items:center;gap:6px;min-height:38px;padding:6px 8px;border-radius:7px;font-size:14px;text-align:left;background:transparent;border:1px solid transparent;color:var(--chalk);width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bp.pick{border-color:var(--line);background:var(--coal);cursor:pointer}
.bp.won{background:var(--strike-tint);border-color:var(--strike);font-weight:700}
.bp.lost{color:var(--dim);text-decoration:line-through}
.bp.bye{color:var(--dim);font-style:italic}
.breakline{margin:14px 0 4px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px;text-align:center;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12.5px;color:var(--steel)}
label.check{display:flex;gap:10px;align-items:center;font-size:15px;min-height:44px}
label.check input{width:22px;height:22px;accent-color:var(--strike)}
.tbl.reck td,.tbl.reck th{white-space:nowrap}
.tbl.payout td:first-child{white-space:normal}
.tbl.payout td .mini{display:block;margin:2px 0 0 !important;white-space:normal}
.tbl.payout td.pts{white-space:nowrap;vertical-align:top}
.nomedia{color:var(--steel);font-size:12px;letter-spacing:.04em}
.teamcard .nomedia{margin-left:8px;padding:1px 7px;border:1px solid var(--line);border-radius:999px}
.follow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.follow .handle{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em}
.linkbtn{background:none;border:0;padding:0;color:var(--steel);text-decoration:underline;cursor:pointer;font:inherit;font-size:inherit}
.inc{padding:10px 0;border-top:1px solid var(--line-soft);font-size:14px}
.inc:first-child{border-top:0}
.inc .top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.inc .when{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel)}
.inc .who{font-weight:700}
.inc .txt{margin:4px 0 0;color:var(--chalk)}
.inc .done{margin:2px 0 0;color:var(--steel)}
.inc .by{margin-top:4px;font-size:12.5px;color:var(--dim)}
.inc .out{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--chalk)}
.inc .out.hot{border-color:var(--strike);color:var(--strike-hi)}
.log{font-size:14px;color:var(--steel);margin:0;padding:0;list-style:none}
.log li{padding:5px 0;border-top:1px solid var(--line-soft);display:flex;gap:10px}
.log li .r{font-family:var(--display);font-weight:700;color:var(--chalk);width:34px;flex:0 0 auto}
/* loading screen */
.loader{position:fixed;inset:0;background:var(--pit);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;z-index:60;padding:24px}
.loader-logo{width:min(340px,74vw)}
.pitbuild{width:150px;height:150px;overflow:visible}
.pitbuild .wall{stroke:var(--chalk);stroke-width:8;stroke-linecap:square;fill:none;opacity:0}
.pitbuild .wall.on{opacity:1;stroke-dashoffset:0 !important;transition:stroke-dashoffset .26s ease-out}
.pitbuild .ball{fill:var(--strike);opacity:0;transform:translateY(-18px);transition:opacity .3s ease-out,transform .4s cubic-bezier(.3,1.4,.6,1)}
.pitbuild .ball.on{opacity:1;transform:translateY(0)}
.loader-cap{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.06em;color:var(--steel);min-height:26px;text-align:center}
.loader-cap b{color:var(--chalk)}
@media (prefers-reduced-motion:reduce){.pitbuild .wall.on,.pitbuild .ball{transition:none}}

/* launch countdown */
.weekpill.launch{border-color:var(--strike);color:var(--chalk);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.weekpill.launch .lt{color:var(--steel);font-weight:600;font-size:13px}
.weekpill.launch .num{font-variant-numeric:tabular-nums;font-size:16px}
@media (max-width:420px){.weekpill.launch .lt{display:none}}
.launch-hero{background:var(--ash);border:1px solid var(--line-soft);border-left:4px solid var(--strike);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.launch-hero .lh-top{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--strike)}
.launch-hero .lh-when{font-family:var(--display);font-weight:700;font-size:22px;margin:2px 0 10px}
.launch-hero .lh-count{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:440px}
.launch-hero .lh-count div{background:var(--pit);border:1px solid var(--line-soft);border-radius:8px;padding:8px 6px;text-align:center}
.launch-hero .lh-count b{display:block;font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.launch-hero .lh-count small{display:block;color:var(--steel);font-size:12px;margin-top:4px;letter-spacing:.04em}

/* league header */
.league-head{text-align:center;margin:0 0 18px}
.league-logo{width:min(440px,90%);margin:0 auto 6px}
.llogo{position:relative;display:block;line-height:0}
.llogo img{display:block;width:100%;height:auto}
.llogo .fire{position:absolute;left:85%;top:50%;width:20%;height:50%;pointer-events:none;overflow:visible}
/* One flame, one clock: the whole body sways from its base; the core only breathes inside it
   (same period and direction, no skew) and flickers in brightness, so it can never leave the outer flame. */
.fire .f-body,.fire .f-inner,.fire .f-glow{transform-box:fill-box;transform-origin:50% 100%}
.fire .f-body{animation:flick .46s ease-in-out infinite alternate}
.fire .f-inner{animation:breathe .46s ease-in-out infinite alternate}
.fire .f-core{animation:corelight .23s ease-in-out infinite alternate}
.fire .f-glow{transform-origin:50% 50%;animation:fglow 1.2s ease-in-out infinite alternate}
.fire .s{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:smoke 3.4s ease-out infinite}
.fire .s2{animation-delay:1.15s}.fire .s3{animation-delay:2.3s}
.fire .f-ember{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:ember 2.1s ease-out infinite}
.fire .e2{animation-delay:1s}
@keyframes flick{from{transform:scale(.95,.9) skewX(-6deg)}to{transform:scale(1.05,1.1) skewX(6deg)}}
@keyframes breathe{from{transform:scale(.97,.93)}to{transform:scale(1.03,1.07)}}
@keyframes corelight{from{opacity:.82}to{opacity:1}}
@keyframes fglow{from{opacity:.5;transform:scale(.9)}to{opacity:.95;transform:scale(1.15)}}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.5)}12%{opacity:.5}100%{opacity:0;transform:translate(18px,-78px) scale(2.4)}}
@keyframes ember{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(10px,-60px)}}
@media (prefers-reduced-motion:reduce){.fire *{animation:none !important}.fire .s{opacity:.3;transform:translate(8px,-34px) scale(1.5)}.fire .f-ember{opacity:0}}
.league-sub{color:var(--steel);font-size:15px}
/* the officers' podium: commissioner on the top step, treasurer and secretary either side */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;align-items:end;max-width:540px;margin:10px auto 18px;border-bottom:2px solid var(--line)}
.pedestal{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
.pedestal .who{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:4px 4px 8px;min-width:0;max-width:100%;background:transparent;border:0;color:var(--chalk);border-radius:8px}
.pedestal .who:active{background:var(--coal)}
.pedestal small{color:var(--steel);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--display);font-weight:700}
.pedestal b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.05;overflow-wrap:break-word}
.pedestal .base{width:100%;background:linear-gradient(180deg,var(--coal),var(--ash));border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;height:30px;position:relative}
.pedestal.p1 .base{height:60px;border-top:3px solid var(--strike)}
.pedestal.p2 .base{height:44px}
.pedestal.p3 .base{height:30px}
.pedestal.p1 b{font-size:22px}
.pedestal.p1 small{color:var(--strike)}
.officers{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;margin:4px 0 6px}
.officer{display:flex;flex-direction:column;align-items:center;gap:1px;background:transparent;border:0;color:var(--chalk);padding:4px 8px;border-radius:8px}
.officer:active{background:var(--coal)}
.officer small{color:var(--steel);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--display);font-weight:700}
.officer b{font-family:var(--display);font-weight:700;font-size:18px}

/* tv board */
.tv{min-height:100vh;background:var(--pit);padding:22px 28px 28px;display:flex;flex-direction:column;gap:18px}
.tv-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.tv-top .tv-logo{height:64px;width:auto;aspect-ratio:1000 / 630}
.tv-top .tv-logo img{height:64px;width:auto}
.tv-top .wk{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.02em}
.tv-top .wk small{color:var(--steel);font-weight:600;font-size:18px;margin-left:12px}
.tv-pits{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:860px){.tv-pits{grid-template-columns:1fr}}
.tv-pit{background:var(--ash);border:2px solid var(--line);border-radius:14px;padding:20px 22px;display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.tv-pit.live{border-color:var(--strike)}
.tv-pit .lbl{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.08em}
.tv-pit .code{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.5vw,64px);letter-spacing:.04em;line-height:1}
.tv-pit .tname{color:var(--steel);font-size:clamp(14px,1.4vw,20px)}
.tv-pit .r{text-align:right}
.tv-pit .rounds{font-family:var(--display);font-weight:800;font-size:clamp(72px,10vw,150px);line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:14px}
.tv-pit .rounds .dash{color:var(--dim);font-size:.5em}
.tv-pit .state{grid-column:1 / -1;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(16px,1.6vw,24px);letter-spacing:.08em;color:var(--steel);text-transform:uppercase}
.tv-pit .state b{color:var(--chalk)}
.tv-pit .inpit{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tv-pit .inpit span{font-family:var(--display);font-weight:700;font-size:clamp(14px,1.3vw,20px);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.tv-pit .inpit span.out{opacity:.3;text-decoration:line-through}
.tv-pit .r .inpit{justify-content:flex-end}
.tv-bottom{display:grid;grid-template-columns:3fr 2fr;gap:18px}
@media (max-width:860px){.tv-bottom{grid-template-columns:1fr}}
.tv .tbl th,.tv .tbl td{font-size:clamp(15px,1.5vw,22px);padding:8px 10px}
.tv .tbl td.pts{font-size:clamp(20px,2vw,30px)}
.tv-next{display:flex;flex-direction:column;gap:8px}
.tv-next .sb{pointer-events:none}
.tv-exit{position:fixed;top:10px;right:12px;opacity:.35}
.tv-exit:hover{opacity:1}
/* admin setup */
.setup{margin:0 0 16px}
.setup-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:640px){.setup-steps{grid-template-columns:repeat(2,minmax(0,1fr))}.setup-steps .step:last-child{grid-column:1 / -1}}
.step{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--ash);text-align:left;color:var(--chalk);min-height:72px}
.step.done{border-color:var(--line-soft);color:var(--steel)}
.step.next{border-color:var(--strike)}
.step .st-mark{font-family:var(--display);font-weight:800;color:var(--chalk);height:14px;line-height:14px;font-size:14px}
.step .st-l{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.02em}
.step .st-n{font-size:12px;color:var(--steel);line-height:1.2}
.setup-next{margin-top:8px;font-size:15px;color:var(--chalk);border-left:3px solid var(--strike);padding:6px 12px}
.setup-next.done{border-left-color:var(--steel);color:var(--steel)}
.acct-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line-soft)}
.acct-row:first-child{border-top:0}
.acct-main{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 220px}
.acct-main b{font-family:var(--display);font-weight:700;font-size:18px}
.acct-main .placed{font-size:14px;color:var(--chalk);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.acct-main .waiting{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--strike)}
.acct-ctl{display:flex;gap:8px;flex-wrap:wrap}
.acct-ctl select{min-width:140px;width:auto}

/* account */
.acct{display:flex;align-items:center;gap:14px;margin:0 0 14px}
.acct-av{width:64px;height:64px;border-radius:50%;background:var(--coal);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:24px;flex:0 0 64px}
.acct-av.role-admin{border-color:var(--strike)}
.acct-av.role-support{border-color:var(--chalk)}
.acct-name{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05}
.acct-role{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--steel);margin-top:2px}
.gbpi{font-family:var(--display);font-weight:800;letter-spacing:.12em;font-size:15px;color:var(--chalk);border:1px solid var(--line);border-radius:4px;padding:2px 8px;display:inline-block;margin-top:4px;font-variant-numeric:tabular-nums}

/* league card */
.cardpage{min-height:100vh;background:var(--pit);padding:20px 16px 40px;display:flex;flex-direction:column;align-items:center}
.card-actions{width:100%;max-width:520px;display:flex;justify-content:space-between;margin-bottom:16px}
.lcard{position:relative;width:min(520px,100%);aspect-ratio:1.586;background:#101014;border:2px solid var(--strike);border-radius:14px;padding:5% 5.5%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;color:var(--chalk);container-type:inline-size}
.lcard .lc-stripe{position:absolute;left:0;top:0;bottom:0;width:3.2%;background:var(--team)}
.lcard .lc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lcard .lc-logo{height:13cqw;width:auto}
.lcard .lc-league{font-family:var(--display);font-weight:800;font-size:3.6cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
.lcard .lc-mid{display:flex;align-items:center;gap:4%}
.lcard .lc-num{font-family:var(--display);font-weight:800;font-size:20cqw;line-height:.9;color:var(--team);font-variant-numeric:tabular-nums;min-width:18cqw;text-align:center}
.lcard .lc-who{min-width:0;flex:1 1 auto}
.lcard .lc-name{font-family:var(--display);font-weight:800;font-size:8.4cqw;line-height:.98;letter-spacing:.01em;overflow-wrap:anywhere}
.lcard .lc-name.n2{font-size:7.2cqw}.lcard .lc-name.n3{font-size:6.2cqw}.lcard .lc-name.n4{font-size:5.4cqw}
.lcard .lc-team{font-size:3.8cqw;color:var(--steel);margin-top:1.2cqw}
.lcard .lc-style{font-family:var(--display);font-weight:700;font-size:3.6cqw;letter-spacing:.06em;text-transform:uppercase;color:var(--strike);margin-top:1.6cqw}
.lcard .lc-bot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.lcard .lc-idn{font-family:var(--display);font-weight:800;font-size:4.6cqw;letter-spacing:.16em;font-variant-numeric:tabular-nums;margin-bottom:1cqw}
.lcard .barcode{width:38cqw;height:7.5cqw;display:block;border-radius:0.8cqw}
.lcard .lc-line{display:flex;gap:3cqw;font-size:3cqw;color:var(--steel);text-align:right;flex-wrap:wrap;justify-content:flex-end}
.lcard .lc-line b{color:var(--chalk);font-family:var(--display);font-weight:800;font-size:4cqw}
/* the back */
.lcard.back .lc-top .lc-idn{margin:0;color:var(--steel);font-size:3.6cqw}
.lcard .lc-sig{background:#f2f2f0;color:#0c0c0e;border-radius:1.4cqw;padding:1.6cqw 2.6cqw 2cqw;height:16cqw;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box}
.lcard .lc-sig-l{font-family:var(--display);font-weight:700;font-size:2.6cqw;letter-spacing:.14em;text-transform:uppercase;color:#5a5e63}
.lcard .lc-sig-line{display:flex;align-items:flex-end;border-bottom:0.35cqw solid #0c0c0e;height:7cqw;font-size:3cqw;color:#5a5e63;padding-left:0.6cqw}
.lcard .lc-fine{font-size:2.85cqw;line-height:1.3;color:var(--steel);margin:0}
.lcard .lc-logo.sm{height:9cqw;opacity:.9}
.lcard.back .lc-line{text-align:left;justify-content:flex-start;flex-direction:column;gap:0.4cqw}
.lcard.back .lc-line b{font-size:3cqw}
/* flip it over */
.flipcard{width:min(520px,100%);aspect-ratio:1.586;perspective:1400px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:14px;outline:none}
.flipcard:focus-visible{box-shadow:0 0 0 3px var(--chalk)}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .75s cubic-bezier(.2,.75,.2,1);transform-style:preserve-3d}
.flipcard.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(0deg)}
.flip-face.back{transform:rotateY(180deg)}
.flip-face .lcard{width:100%;height:100%;aspect-ratio:auto;backface-visibility:hidden;-webkit-backface-visibility:hidden}
@media (prefers-reduced-motion:reduce){.flip-inner{transition:none}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-height:36px;padding:0 12px;border:0;background:transparent;color:var(--steel);font-family:var(--display);font-weight:700;font-size:15px}
.seg button.on{background:var(--chalk);color:var(--pit)}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.card-link{display:block;min-width:0;text-decoration:none;color:inherit;border-radius:14px}
.card-link:focus-visible{outline:2px solid var(--chalk);outline-offset:3px}
.card-link .lcard{width:100%}
@media print{
  @page{margin:0.4in}
  html,body{background:#fff}
  .topbar,.nav,.card-actions,.cardpage .help,.toast,.syncbar,.foot,.noprint{display:none !important}
  /* the waiver prints as a plain form */
  main.v-admin .setup,main.v-admin .weektabs,main.v-admin .btnrow,main.v-admin h1{display:none !important}
  main.v-admin .inc .out{border-color:#000;color:#000}
  main.v-waiver{padding:0 !important;max-width:none !important}
  main.v-waiver .doc{max-width:none}
  main.v-waiver h1,main.v-waiver .lede,main.v-waiver .pill{display:none}
  .paper{background:#fff;border:0;border-radius:0;padding:0;color:#000}
  .paper *{color:#000 !important}
  .paper-warn,.paper-head{border-color:#e3001b}
  .paper-warn{color:#e3001b !important}
  .doc.waiver .paper p{font-size:10.5pt;line-height:1.35}
  .doc.waiver .paper h3{font-size:10.5pt;margin:8pt 0 2pt;break-after:avoid}
  .sigs{break-inside:avoid;page-break-inside:avoid}
  .sig{border-bottom-color:#000;height:30pt}
  .sig .lab,.paper-office,.paper-foot,.paper-sub{color:#555 !important}
  main.v-cards .weektabs,main.v-cards .wrap>.section-title,main.v-cards .wrap>.row,main.v-cards .wrap>.help{display:none !important}
  main.v-cards,main.v-cards .wrap{padding:0 !important;margin:0 !important;max-width:none !important}
  .cardpage{padding:0;min-height:0;background:#fff;display:block}
  .lcard{width:3.375in;height:2.125in;aspect-ratio:auto;border-radius:0.1in;-webkit-print-color-adjust:exact;print-color-adjust:exact;border-color:var(--strike);break-inside:avoid;page-break-inside:avoid}
  /* one card: front and back side by side, flat */
  .flipcard{width:auto;aspect-ratio:auto;perspective:none}
  .flip-inner{transform:none !important;transform-style:flat;position:static;display:flex;gap:0.2in;width:auto;height:auto}
  .flip-face,.flip-face.back{position:static;transform:none;backface-visibility:visible;-webkit-backface-visibility:visible;flex:0 0 auto}
  .flip-face .lcard{width:3.375in;height:2.125in;backface-visibility:visible;-webkit-backface-visibility:visible}
  /* the sheet: two across; backs mirrored so a long-edge duplex lines up */
  .cards-grid{display:grid;grid-template-columns:repeat(2,3.375in);gap:0.2in;justify-content:start}
  .cards-grid.backs{direction:rtl}
  .cards-grid.backs .lcard{direction:ltr}
  .card-link{break-inside:avoid;page-break-inside:avoid}
  .card-link .lcard{width:3.375in}
}

/* night ops */
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
@media (min-width:720px){.slots{grid-template-columns:repeat(4,minmax(0,1fr))}}
.slotbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.slotbox.run{border-color:var(--chalk)}
.slotbox.over{border-color:var(--strike)}
.slotbox .sl{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--steel)}
.slotbox .t{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.slotbox.over .t{color:var(--strike)}
.slotbox .st{font-size:13px;color:var(--steel);margin-bottom:4px}
.feegrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
@media (min-width:720px){.feegrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.warn{font-family:var(--display);font-weight:700;letter-spacing:.04em;color:var(--strike);font-size:14px;margin:-4px 0 8px}
.syncbar{position:fixed;top:var(--top-h);left:0;right:0;background:var(--strike);color:var(--strike-ink);font-weight:600;font-size:14px;text-align:center;padding:7px 12px;z-index:35}
@media (min-width:900px){.syncbar{left:var(--rail-w)}}

/* profiles and stats */
.plink{text-decoration:none;border-bottom:1px solid var(--line)}
.plink:hover{border-bottom-color:var(--chalk)}
.profile-head{display:flex;align-items:center;gap:16px;border-left:5px solid var(--line);padding:4px 0 4px 14px;margin-bottom:14px}
.profile-head .jn{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;color:var(--steel)}
.stylepick{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
@media (min-width:640px){.stylepick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bar{display:grid;grid-template-columns:86px 1fr 36px;align-items:center;gap:10px;font-size:14px}
.bar .bl{color:var(--steel);font-family:var(--display);font-weight:700;letter-spacing:.04em}
.bar .bt{height:12px;background:var(--coal);border-radius:3px;overflow:hidden}
.bar .bt span{display:block;height:100%;background:var(--chalk);border-radius:3px}
.bar .bn{text-align:right;font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.tbl.grid th,.tbl.grid td{text-align:center;padding:6px 4px}
.tbl.grid th.on,.tbl.grid td.on{background:rgba(var(--strike-rgb),.08)}
.tbl.grid td.team{text-align:left;position:sticky;left:0;background:var(--pit);z-index:1;box-shadow:inset -1px 0 var(--line-soft)}
.tbl.grid td.team .code{margin-right:0}
.tbl.grid .g{display:flex;flex-direction:column;align-items:center;gap:0;text-decoration:none;color:var(--chalk);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;line-height:1.05;padding:3px 2px;border-radius:4px;min-width:40px}
.tbl.grid .g small{font-family:var(--body);font-weight:500;font-size:11px;color:var(--steel);letter-spacing:0}
.tbl.grid .g.gw{color:var(--chalk)}
.tbl.grid .g.gw small{color:var(--chalk)}
.tbl.grid .g.gw::before{content:"";display:block;width:100%;height:2px;background:var(--chalk);margin-bottom:2px}
.tbl.grid .g.gl{color:var(--dim)}
.tbl.grid .g.gl small{color:var(--dim)}
.tbl.grid .g.glive{color:var(--strike)}
.tbl.payout td.award{white-space:normal;line-height:1.2}
.tbl.payout td:first-child{width:60%}
.tbl.stats th{padding:6px 4px}
.tbl.stats td{padding:9px 6px}
.tbl.stats th:nth-child(2),.tbl.stats td:nth-child(2){position:sticky;left:0;background:var(--pit);z-index:1;box-shadow:inset -1px 0 var(--line-soft)}
.tbl.stats td.team{min-width:124px;max-width:170px;white-space:normal;line-height:1.15}
.tbl.stats td.team a{white-space:nowrap}
.tbl.stats td.team .mini{display:block;margin:0}
@media (max-width:600px){.tbl.stats .rank,.tbl.stats th:first-child{display:none}}
.chips.dense{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.chips.dense .chip{min-height:44px;padding:4px 8px;gap:6px}
.chips.dense .chip .jn{width:26px;font-size:17px}
.chips.dense .chip .pn{font-size:14px}
.chips.dense .chip .how{font-size:12px}
.chips.dense .btn{grid-column:1 / -1}
.stylepick .chip{flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px}
.stylepick .chip .pn{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.02em}
.th{background:none;border:0;padding:4px 4px;color:var(--steel);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;min-height:32px;border-bottom:2px solid transparent}
.th.on{color:var(--chalk);border-bottom-color:var(--strike)}
.hitbtns .btn{min-height:60px;font-size:20px}
button,.btn,.chip,.nav a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px rgba(242,242,240,.3)}
.swatches button.on{border-color:var(--chalk)}
.inline-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.inline-form .fld{flex:1 1 140px}
.mini{font-size:13px;color:var(--steel)}
.ok{color:#5ee29a}
</style>

const WAIVER = {"operator":"Homestretch Holdings LLC","league":"Trailblazer League","sport":"Gauntlet Ball","version":"Waiver v1.3, October 2026","title":"Participation Agreement, Assumption of Risk and Release of Liability","subtitle":"Gauntlet Ball · Trailblazer League · Operated by Homestretch Holdings LLC","warning":"Read this before you sign. By signing it you give up legal rights, including the right to sue Homestretch Holdings LLC for injuries that happen while you play. If you do not agree, do not sign and do not play.","sections":[["1. I am choosing to play.","I am voluntarily taking part in Gauntlet Ball, including Trailblazer League Gauntlets, King of the Pit, the Ladder, honor duels, warm-ups, practices and any related activity (together, \"the Activity\"), organized by Homestretch Holdings LLC (\"the League\"). Nobody is making me play. My participation is at will: I may stop at any time, and the League may end my participation at any time, with or without a reason."],["2. The sport, and what can go wrong.","Gauntlet Ball is intended to be a no-contact sport: players strike the ball with an open palm, and the ball, not the player, is the target. Even so, it is a fast game in a small enclosed pit, and accidents happen. I understand the risks include, without limitation: being hit by the ball anywhere, including the face, eyes and head; collisions with other players, the pit walls, the floor or the ground; slips, trips and falls; sprains, strains, dislocations, broken bones, cuts, concussion and other head, eye or dental injury, heat illness and cardiac events; injury caused by other players, including their mistakes and rule violations; the condition of the pits, equipment and site; and, in rare cases, permanent disability or death."],["3. I accept those risks.","I know, understand and accept these risks, whether or not they are listed above, and whether they come from the nature of the sport itself or from the ordinary negligence of the League or anyone else. I take full responsibility for my own safety and for my decision to participate."],["4. Release of liability.","To the fullest extent the law allows, I release, waive and discharge Homestretch Holdings LLC; its members, managers, officers, employees, agents and volunteers; the League's commissioner, officers, referees and captains; its sponsors; and the owners and occupiers of any property where the Activity takes place (together, the \"Released Parties\") from any and all claims, demands, losses and liability for personal injury, illness, death or property damage arising out of or in any way related to my participation in the Activity, INCLUDING CLAIMS ARISING FROM THE ORDINARY NEGLIGENCE OF THE RELEASED PARTIES. This release does not cover gross negligence, willful misconduct or anything else that cannot be released under California law."],["5. I will not sue, and I will cover claims my conduct causes.","I agree not to sue the Released Parties for any released claim, and I will indemnify and hold them harmless, including for reasonable attorney's fees, from any claim brought on my behalf for a released claim and from any claim by another person that is caused by my own conduct."],["6. Fitness, medical care and insurance.","I am at least 18 years old. I am physically fit to play and have no condition that makes it unsafe for me to participate, or I have cleared my participation with a doctor. I will not play while impaired by alcohol or drugs. If I am injured, I consent to first aid and to emergency medical treatment, and I am responsible for its cost. I am responsible for my own health insurance; the League does not provide any."],["7. Rules and conduct.","I will follow the Gauntlet Ball rulebook, the refs' calls and the league officers' directions, and I will report unsafe conditions and injuries right away. A ref or league officer may stop my play for a suspected injury, and I will not return that night without their OK. I will not strike with a fist, elbow, knee or foot or target another player's head on purpose. Unsafe conduct can get me removed from a night or from the League without a refund, and I am responsible for damage I cause on purpose or recklessly."],["8. Names and statistics.","The League may publish my name, team, GBPI and league statistics to run the League, including on its board, schedule, standings, cards and website, without payment to me. Photos and video are my choice, on page 2."],["9. Unknown claims.","I waive the protection of California Civil Code section 1542, which says: \"A general release does not extend to claims that the creditor or releasing party does not know or suspect to exist in his or her favor at the time of executing the release and that, if known by him or her, would have materially affected his or her settlement with the debtor or released party.\""],["10. General terms.","This agreement is governed by California law. It covers the season named below, including make-up nights and any night added later, and it binds my heirs, family and legal representatives. If any part of it is found unenforceable, the rest still applies. It is the entire agreement between the League and me about its subject. I have read it, I understand it, and I am signing it freely."]],"ack":"I HAVE READ THIS AGREEMENT, I UNDERSTAND THAT I AM GIVING UP LEGAL RIGHTS BY SIGNING IT, AND I SIGN IT VOLUNTARILY.","fields":[["Participant name (print)","GBPI (league ID, if you have one)","Team"],["Season","Phone","Emergency contact (name and phone)"],["Signature","Date"]],"office":"For league use · Received by: __________________   Date: __________   Sign-up fee received: [    ]   Entered in the app: [    ]","media":{"title":"Media and Social Release","intro":"Trailblazer League nights get photographed and filmed, and the League posts them on its social accounts (@TeamGauntletBall) and website. This page is your choice, separate from the waiver on page 1. Saying no doesn't affect your place in the League.","yes":"YES. Homestretch Holdings LLC may photograph and record me during League activities and use those photos and videos, including my name and likeness, on its social accounts, website and promotional material, without payment to me.","no":"NO. Keep me out of posts. If I appear in a photo or video the League posts, my face will be covered with a Gauntlet sticker or the shot won't be used.","change":"I can change my answer at any time by telling a league officer. A change applies to posts made after it; the League will take down a post that shows me on request.","fields":[["Participant name (print)","Team"],["Signature","Date"]]},"fairplay":{"title":"Fair Play Agreement","intro":"Gauntlet Ball is an equal-opportunity sport with real money on the line. It only works if everyone plays by the same calls. By signing, I agree to the following.","points":[["The ref's call is final.","League refs run the pits. Their calls stand, including calls I think are wrong. Only captains speak to the ref, and only to ask what was called."],["Refs are neutral.","Refs are not on any team and do not call games involving anyone on their own roster. Every player and team gets the same rules and the same shot."],["Outcomes stand.","Results, standings, spoils and payouts follow the calls as made. I will not contest a result after the fact, ask for money back, or take a dispute outside the pit."],["Restarts and disputes.","The ref keeps play moving with jump balls. A jump ball restarts play and never puts anyone out. Calls the ref did not see may be settled by one round in the 10 ft pit, as the rulebook describes."],["Conduct.","Arguing, threats or retaliation toward a ref, official or player can get me removed from a night or from the League without a refund."]],"ack":"I HAVE READ THIS AGREEMENT AND SIGN IT FREELY. I AM NOT SIGNING UNDER PRESSURE OR DURESS.","fields":[["Participant name (print)","Team"],["Signature","Date"]]}};

/* ---------- Supabase (live) store ---------- */
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Could not load " + src)); document.head.appendChild(s); }); }

      this.session = session; this.authEvent = event;

        const refLost = !isStaff() && /policy|permission|denied|violates/i.test(r.error.message) && (UI.ref || (this.refLostAt && Date.now() - this.refLostAt < 15000));
        if (refLost) { UI.ref = null; saveRef(); this.refLostAt = Date.now(); toast("Not saved. The ref PIN has changed: tap Ref and enter the new one."); } else toast("Not saved: " + r.error.message);
        this.scheduleRefresh();

  }

  pinVersion() { return (this.data.league || [])[0]?.pinVersion || 0; }

    m.status = "live"; m.startedAt = Date.now() - 3600000;

    while (m.homeRounds < need && m.awayRounds < need) {
      if (stopAt !== null && m.homeRounds + m.awayRounds >= stopAt) return;
      const round = m.homeRounds + m.awayRounds + 1;
      const inH = [...m.homeLineup], inA = [...m.awayLineup];
      const bias = rng() < 0.5 ? 0.4 : 0.6;
      while (inH.length && inA.length) {
        const fromHome = rng() < bias;
        const pool = fromHome ? inH : inA;
        const victim = pool.splice(Math.floor(rng() * pool.length), 1)[0];
        const oppPool = fromHome ? inA : inH;
        const ownPool = fromHome ? inH : inA;
        const r = rng();
        let byId = null;
        if (r < 0.86) byId = oppPool[Math.floor(rng() * oppPool.length)];

  const kohSim = (m) => {
    const used = duelistsTonight(season, m.week, m.id, d);

/* The Reckoning: spoils + place money + awards per team, in even envelopes rounded down to the dollar.
   Before the season ends it reads "if the season ended tonight". */
function reckoning(s) {
  const P = pot(s);
  const st = standings(s);
  const SP = teamSpoils(s);
  const PS = playerStats(s);
  const TT = teamTotals(s);
  const R = Object.fromEntries(teamsOf(s).map((t) => [t.id, { team: t, spoils: SP[t.id]?.total || 0, place: 0, awards: 0, awardNames: [] }]));
  // place money: a shared place splits the money for the places it covers
  let i = 0;
  while (i < st.length) {
    const rank = st[i].rank; const grp = st.filter((x) => x.rank === rank);
    const money_ = sum(P.tiers.filter((t) => t.place >= rank && t.place < rank + grp.length).map((t) => t.amount));
    grp.forEach((x) => (R[x.team.id].place += Math.floor(money_ / grp.length)));
    i += grp.length;
  }
  // awards: player awards pay the player's team; ties split evenly
  (s.awards || []).forEach((a) => {
    const key = awardKey(a); let best = 0, winners = [];
    if (key === "outs" || key === "catches") {
      Object.values(PS).filter((L) => player(L.id) && R[player(L.id).teamId]).forEach((L) => { if (L[key] > best) { best = L[key]; winners = [player(L.id).teamId]; } else if (L[key] === best && best > 0) winners.push(player(L.id).teamId); });
    } else if (key === "koh" || key === "ladder") {
      Object.entries(TT).forEach(([tid, x]) => { if (x[key] > best) { best = x[key]; winners = [tid]; } else if (x[key] === best && best > 0) winners.push(tid); });
    }
    if (!best) return;
    winners.forEach((tid) => { R[tid].awards += Math.floor(a.amount / winners.length); R[tid].awardNames.push(a.name); });
  });
  const rows = Object.values(R).map((x) => { const roster = playersOf(x.team.id).length || 1; const total = x.spoils + x.place + x.awards; const env = Math.floor(total / roster); return { ...x, roster, total, envelope: env, leftover: total - env * roster }; });
  rows.sort((a, b) => b.total - a.total);
  return { rows, leftover: sum(rows.map((r) => r.leftover)), paid: sum(rows.map((r) => r.envelope * r.roster)) };
}

async function startMatch(m) {

  const home = (m.homeLineup || []).length ? m.homeLineup : defaultLineup(m.homeId, s, m.week);
  const away = (m.awayLineup || []).length ? m.awayLineup : defaultLineup(m.awayId, s, m.week);

}

async function logOut(m, playerId, byPlayerId) {
  const v = matchView(m);
  if (v.outIds.has(playerId)) return;
  const teamId = playerTeam(m, playerId);
  const willEmpty = (teamId === m.homeId ? v.homeIn : v.awayIn).length === 1;
  await store.insert("outs", { matchId: m.id, round: v.round, playerId, teamId, byPlayerId, closedRound: willEmpty, ts: Date.now() });
  buzz(willEmpty ? [40, 60, 40] : 25);
  if (willEmpty) {
    const winner = teamId === m.homeId ? m.awayId : m.homeId;
    const patch = winner === m.homeId ? { homeRounds: m.homeRounds + 1 } : { awayRounds: m.awayRounds + 1 };
    const hr = patch.homeRounds ?? m.homeRounds, ar = patch.awayRounds ?? m.awayRounds;
    if (hr >= v.need || ar >= v.need) Object.assign(patch, { status: "final", winnerId: winner, loserLastMan: playerId, finishedAt: Date.now() });
    await store.update("matches", m.id, patch);
    toast(hr >= v.need || ar >= v.need ? "Gauntlet final. King of the Pit is next." : "Round to " + team(winner).code);
  }
}
async function undoOut(m) {
  const v = matchView(m);
  const last = v.last; if (!last) return;
  await store.remove("outs", last.id);
  if (last.closedRound) {
    const winner = last.teamId === m.homeId ? m.awayId : m.homeId;
    const patch = winner === m.homeId ? { homeRounds: Math.max(0, m.homeRounds - 1) } : { awayRounds: Math.max(0, m.awayRounds - 1) };
    if (m.status === "final") Object.assign(patch, { status: "live", winnerId: null, loserLastMan: null, finishedAt: null });
    await store.update("matches", m.id, patch);
  }
  toast("Undone");
}

  await store.update("matches", m.id, { status: "forfeit", forfeitBy: byTeamId, winnerId: winner, homeRounds: winner === m.homeId ? need : 0, awayRounds: winner === m.awayId ? need : 0, finishedAt: Date.now(), koh: { home: null, away: null, games: [], winnerId: winner, walkover: true } });

    <div class="meta"><span class="pit">Pit ${h(m.pit)}</span>${v ? `<span>Round ${v.round}, ${v.homeIn.length} v ${v.awayIn.length} in the pit</span>` : `<span>Slot ${m.slot}</span>`}${statusPill(m)}</div>`;
  return link ? `<a class="sb ${m.status === "live" ? "live" : ""}" href="#score/m/${h(m.id)}">${inner}</a>` : `<div class="sb ${m.status === "live" ? "live" : ""}">${inner}</div>`;
}
function bigBoard(m) {

    <div class="state">Pit ${h(m.pit)}, round <b>${v.round}</b>, first to ${v.need}</div>
  </a>`;
}
